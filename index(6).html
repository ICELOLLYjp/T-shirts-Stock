<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="T在庫">
<title>Tシャツ在庫管理</title>
<style>
  :root {
    --bg: #f4f3ef;
    --card: #ffffff;
    --border: #e2e0d8;
    --text: #1f1e1c;
    --text-secondary: #6b6a64;
    --text-muted: #9a9890;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --danger: #a32d2d;
    --danger-bg: #fcebeb;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a;
      --card: #232228;
      --border: #35333a;
      --text: #f1f0ec;
      --text-secondary: #b4b2a9;
      --text-muted: #77756e;
      --accent: #85b7eb;
      --accent-bg: #0c447c;
      --danger: #f09595;
      --danger-bg: #501313;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  body {
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 20px 0 16px;
  }
  .sort-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sort-label {
    font-size: 13px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  select {
    height: 36px;
    padding: 0 10px;
    font-size: 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  #sort-mode { flex: 1; }

  .stock-summary {
    margin: 0 0 10px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .stock-summary-label {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .stock-summary-value {
    font-size: 24px;
    font-weight: 700;
  }
  .stock-summary-unit {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .production-summary {
    margin: 0 0 14px;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .production-summary-title {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .production-color-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .production-color-table th,
  .production-color-table td {
    padding: 7px 4px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .production-color-table th {
    color: var(--text-secondary);
    font-weight: 500;
  }
  .production-color-table th:first-child,
  .production-color-table td:first-child {
    text-align: left;
    padding-left: 2px;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .production-color-table td:last-child {
    font-weight: 700;
  }
  .production-empty {
    padding: 8px 0 2px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .production-summary-footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
  }
  .production-summary-footer strong {
    color: var(--text);
    font-size: 16px;
  }

  .design-settings {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: -6px 0 14px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .priority-label {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .star-btn {
    min-width: 92px;
    height: 36px;
    padding: 0 12px;
    font-size: 14px;
    font-weight: 600;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
  }
  .star-btn.active {
    background: var(--accent-bg);
    color: var(--accent);
    border: 2px solid var(--accent);
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .tab {
    padding: 6px 12px;
    font-size: 13px;
    border-radius: var(--radius);
    background: var(--card);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .tab.active {
    background: var(--accent-bg);
    color: var(--accent);
    border: 2px solid var(--accent);
  }
  .tab-star {
    margin-right: 3px;
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .total-label { font-size: 14px; color: var(--text-secondary); }
  .total-value { font-size: 26px; font-weight: 600; }
  .total-unit { font-size: 13px; color: var(--text-secondary); font-weight: 400; }
  .size-header {
    display: flex;
    gap: 6px;
    padding-left: 96px;
    margin-bottom: 8px;
  }
  .size-header div {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .color-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .color-row { display: flex; align-items: center; gap: 6px; }
  .planned-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .planned-label {
    width: 90px;
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .planned-input {
    width: 100%;
    min-width: 0;
    height: 34px;
    padding: 0 4px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .color-name {
    width: 90px;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .size-cell {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .qty-btn {
    width: 30px; height: 30px;
    padding: 0;
    font-size: 16px;
    line-height: 1;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  .qty-btn:active { transform: scale(0.94); }
  .qty-val {
    font-size: 14px;
    font-weight: 600;
    min-width: 20px;
    text-align: center;
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .subtotal { font-size: 12px; color: var(--text-secondary); }
  .remove-btn {
    font-size: 12px;
    padding: 4px 10px;
    color: var(--danger);
    background: var(--danger-bg);
    border: none;
    border-radius: 8px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  input[type="text"] {
    flex: 1;
    height: 40px;
    padding: 0 12px;
    font-size: 15px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  input[type="text"].error { border-color: var(--danger); }
  .icon-btn {
    width: 44px; height: 40px;
    flex-shrink: 0;
    font-size: 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  .section-divider {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .empty-note {
    font-size: 13px;
    color: var(--text-muted);
    margin: 4px 0 12px;
  }
  .delete-design-btn {
    width: 100%;
    margin-top: 4px;
    font-size: 13px;
    padding: 10px;
    color: var(--danger);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .sync-status {
    margin: -10px 0 14px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .sync-status.error { color: var(--danger); }
  .sync-status.ok { color: var(--accent); }

  .export-row {
    display: flex;
    gap: 8px;
    margin: 0 0 14px;
  }
  .export-btn {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--accent);
  }

</style>
</head>
<body>

<h1>Tシャツ在庫管理</h1>
<div id="sync-status" class="sync-status">Firebaseに接続しています…</div>
<div class="sort-row">
  <span class="sort-label">並び替え</span>
  <select id="sort-mode">
    <option value="priority">★ 優先順</option>
    <option value="stock-asc">在庫 少ない順</option>
    <option value="stock-desc">在庫 多い順</option>
    <option value="name">名前順</option>
  </select>
</div>
<div id="stock-summary"></div>
<div class="export-row"><button class="export-btn" id="export-inventory-btn" type="button">在庫CSVを書き出す</button></div>
<div id="production-summary"></div>
<div class="tabs" id="design-tabs"></div>
<div id="app"></div>

<div class="add-row">
  <input id="new-color" type="text" placeholder="色を追加(例:ネイビー)" />
  <button class="icon-btn" id="add-color-btn">＋</button>
</div>

<div class="section-divider add-row">
  <input id="new-design" type="text" placeholder="新しいデザイン名を追加" />
  <button class="icon-btn" id="add-design-btn">＋</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA1AZlnCYr5cfHG3HDcyvG17jokBnr5lO8",
  authDomain: "t-shirtstock.firebaseapp.com",
  projectId: "t-shirtstock",
  storageBucket: "t-shirtstock.firebasestorage.app",
  messagingSenderId: "485805702075",
  appId: "1:485805702075:web:f9d8668ca57d9f58c4229e",
  measurementId: "G-TXEHB9FGSR"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const sharedRef = doc(db, 'tshirtStock', 'shared');

const SIZES = ['S','M','L','XL','XXL'];
const STORAGE_KEY = 'tshirt-stock-by-design';
const UI_STORAGE_KEY = 'tshirt-stock-ui';
let cloudReady = false;
let cloudSaveTimer = null;

const DEFAULT_COLORS = ['ナチュラル','ブラック','グリーン','パープル','ピンク','ベージュ','VB','VN','VP','VG'];
const DEFAULT_DESIGNS = ['Bigwave','Share the pavement','Gull','Sink','Rays','Cherry','Squids','Whole ocean dive club','See you in water','DEEP','Safe Surf','SALTY'];

function buildDefaultDesigns(){
  const designs = {};
  DEFAULT_DESIGNS.forEach(name => {
    designs[name] = { colors: [...DEFAULT_COLORS], stock: {}, planned: {}, starred: false };
  });
  return designs;
}

let state = {
  designs: buildDefaultDesigns(),
  activeDesign: DEFAULT_DESIGNS[0],
  sortMode: 'priority'
};

function ensureStock(design){
  const d = state.designs[design];
  if(!d.planned) d.planned = {};
  d.colors.forEach(c => {
    if(!d.stock[c]) d.stock[c] = {};
    if(!d.planned[c]) d.planned[c] = {};
    SIZES.forEach(s => {
      if(d.stock[c][s] == null) d.stock[c][s] = 0;
      if(d.planned[c][s] == null) d.planned[c][s] = 0;
    });
  });
}

function totalForColor(design, color){
  const d = state.designs[design];
  return SIZES.reduce((sum,s) => sum + (d.stock[color]?.[s] || 0), 0);
}
function totalForDesign(design){
  const d = state.designs[design];
  return d.colors.reduce((sum,c) => sum + totalForColor(design,c), 0);
}
function totalStockAll(){
  return Object.keys(state.designs).reduce((sum, design) => {
    ensureStock(design);
    return sum + totalForDesign(design);
  }, 0);
}
function renderStockSummary(){
  const box = document.getElementById('stock-summary');
  if(!box) return;
  box.innerHTML = `
    <div class="stock-summary">
      <span class="stock-summary-label">Tシャツ在庫 合計</span>
      <span class="stock-summary-value">${totalStockAll()}<span class="stock-summary-unit"> 枚</span></span>
    </div>`;
}
function totalPlannedForColor(design, color){
  const d = state.designs[design];
  return SIZES.reduce((sum,s) => sum + (d.planned?.[color]?.[s] || 0), 0);
}
function totalPlannedForDesign(design){
  const d = state.designs[design];
  return d.colors.reduce((sum,c) => sum + totalPlannedForColor(design,c), 0);
}

function plannedColorNames(){
  const names = [];
  const seen = new Set();
  const add = color => {
    if(!seen.has(color)){
      seen.add(color);
      names.push(color);
    }
  };
  DEFAULT_COLORS.forEach(add);
  Object.keys(state.designs).forEach(design => {
    state.designs[design].colors.forEach(add);
  });
  return names;
}

function totalPlannedForColorSize(color, size){
  return Object.keys(state.designs).reduce((sum, design) => {
    ensureStock(design);
    return sum + (state.designs[design].planned?.[color]?.[size] || 0);
  }, 0);
}

function totalPlannedAcrossDesignsForColor(color){
  return SIZES.reduce((sum, size) => sum + totalPlannedForColorSize(color, size), 0);
}

function plannedColorSummary(){
  return plannedColorNames()
    .map(color => ({
      color,
      sizes: Object.fromEntries(SIZES.map(size => [size, totalPlannedForColorSize(color, size)])),
      total: totalPlannedAcrossDesignsForColor(color)
    }))
    .filter(item => item.total > 0);
}

function totalPlannedAll(){
  return plannedColorSummary().reduce((sum, item) => sum + item.total, 0);
}

function plannedDesignCount(){
  return Object.keys(state.designs).filter(design => totalPlannedForDesign(design) > 0).length;
}

function plannedDesignSummary(){
  return Object.keys(state.designs)
    .map(design => ({ design, total: totalPlannedForDesign(design) }))
    .filter(item => item.total > 0)
    .sort((a,b) => b.total - a.total || a.design.localeCompare(b.design, 'ja'));
}

function renderProductionSummary(){
  const box = document.getElementById('production-summary');
  if(!box) return;
  const summary = plannedColorSummary();
  const designSummary = plannedDesignSummary();
  box.innerHTML = `
    <div class="production-summary">
      <div class="production-summary-title">制作予定に必要なTシャツ 色別集計</div>
      ${summary.length ? `
        <table class="production-color-table">
          <thead>
            <tr>
              <th>色</th>
              ${SIZES.map(size => `<th>${size}</th>`).join('')}
              <th>計</th>
            </tr>
          </thead>
          <tbody>
            ${summary.map(item => `
              <tr>
                <td>${item.color}</td>
                ${SIZES.map(size => `<td>${item.sizes[size]}</td>`).join('')}
                <td>${item.total}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : '<div class="production-empty">制作予定はまだありません。</div>'}

      ${designSummary.length ? `
        <div class="production-summary-title" style="margin-top:14px;">制作予定 デザイン別集計</div>
        <table class="production-color-table">
          <thead>
            <tr>
              <th>デザイン</th>
              <th>数量</th>
            </tr>
          </thead>
          <tbody>
            ${designSummary.map(item => `
              <tr>
                <td>${item.design}</td>
                <td>${item.total} 枚</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : ''}

      <div class="production-summary-footer">
        <span>合計 <strong>${totalPlannedAll()}</strong> 枚</span>
        <span>デザイン <strong>${plannedDesignCount()}</strong> 種</span>
      </div>
    </div>`;
}


function exportInventoryCsv(){
  const rows = [['デザイン','色','サイズ','在庫数','制作予定','優先']];
  Object.keys(state.designs).forEach(design => {
    ensureStock(design);
    const d = state.designs[design];
    d.colors.forEach(color => {
      SIZES.forEach(size => {
        const stock = Number(d.stock?.[color]?.[size] || 0);
        const planned = Number(d.planned?.[color]?.[size] || 0);
        if(stock > 0 || planned > 0){
          rows.push([design, color, size, stock, planned, d.starred ? '★' : '']);
        }
      });
    });
  });

  const csv = rows.map(row => row.map(value => {
    const text = String(value ?? '');
    return '"' + text.replace(/"/g, '""') + '"';
  }).join(',')).join('\r\n');

  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tshirt_inventory_${y}${m}${d}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function setSyncStatus(text, mode = ''){
  const el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (mode ? ' ' + mode : '');
}

function saveLocal(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    localStorage.setItem(UI_STORAGE_KEY, JSON.stringify({
      activeDesign: state.activeDesign,
      sortMode: state.sortMode
    }));
  } catch(e){
    console.error('local save failed', e);
  }
}

async function saveCloudNow(){
  if(!cloudReady) return;
  setSyncStatus('同期中…');
  try {
    await setDoc(sharedRef, {
      designs: state.designs,
      updatedAt: serverTimestamp()
    });
    setSyncStatus('共有済み', 'ok');
  } catch(e){
    console.error('cloud save failed', e);
    setSyncStatus('同期エラー：Firestoreの設定を確認してください', 'error');
  }
}

function save(){
  saveLocal();
  if(!cloudReady) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(saveCloudNow, 250);
}

function sortedDesignNames(){
  const names = Object.keys(state.designs);
  const mode = state.sortMode || 'priority';
  return names.sort((a,b) => {
    if(mode === 'priority'){
      const sa = state.designs[a].starred ? 1 : 0;
      const sb = state.designs[b].starred ? 1 : 0;
      return sb - sa;
    }
    if(mode === 'stock-asc') return totalForDesign(a) - totalForDesign(b);
    if(mode === 'stock-desc') return totalForDesign(b) - totalForDesign(a);
    if(mode === 'name') return a.localeCompare(b, 'ja');
    return 0;
  });
}

function renderTabs(){
  const tabs = document.getElementById('design-tabs');
  let html = '';
  sortedDesignNames().forEach(name => {
    const active = name === state.activeDesign;
    const star = state.designs[name].starred ? '<span class="tab-star">★</span>' : '';
    html += `<button class="tab ${active ? 'active' : ''}" data-select-design="${name}">${star}${name}</button>`;
  });
  tabs.innerHTML = html;
  tabs.querySelectorAll('button[data-select-design]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeDesign = btn.getAttribute('data-select-design');
      renderTabs();
      render();
      saveLocal();
    });
  });
}

function render(){
  renderStockSummary();
  renderProductionSummary();
  const design = state.activeDesign;
  if(!state.designs[design]) return;
  ensureStock(design);
  const d = state.designs[design];
  const app = document.getElementById('app');
  let html = '';

  html += `<div class="total-row">
    <span class="total-label">${design} 合計在庫</span>
    <span class="total-value">${totalForDesign(design)}<span class="total-unit"> 枚</span></span>
  </div>`;
  html += `<div class="total-row">
    <span class="total-label">制作予定 合計</span>
    <span class="total-value">${totalPlannedForDesign(design)}<span class="total-unit"> 枚</span></span>
  </div>`;

  html += `<div class="design-settings">
    <div>
      <span class="priority-label">制作優先</span>
    </div>
    <button class="star-btn ${d.starred ? 'active' : ''}" id="star-priority-btn" type="button">${d.starred ? '★ 優先' : '☆ 優先'}</button>
  </div>`;

  if(d.colors.length > 0){
    html += '<div class="size-header">' + SIZES.map(s => `<div>${s}</div>`).join('') + '</div>';
  } else {
    html += '<p class="empty-note">まだ色が登録されていません。下から追加してください。</p>';
  }

  d.colors.forEach(color => {
    html += `<div class="color-card">
      <div class="color-row">
        <div class="color-name">${color}</div>
        ${SIZES.map(size => {
          const qty = d.stock[color][size];
          return `<div class="size-cell">
            <button class="qty-btn" data-color="${color}" data-size="${size}" data-delta="-1">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" data-color="${color}" data-size="${size}" data-delta="1">＋</button>
          </div>`;
        }).join('')}
      </div>
      <div class="planned-row">
        <div class="planned-label">制作予定</div>
        ${SIZES.map(size => {
          const plannedQty = d.planned[color][size];
          return `<div class="size-cell">
            <input class="planned-input" type="number" min="0" inputmode="numeric" data-planned-color="${color}" data-planned-size="${size}" value="${plannedQty}">
          </div>`;
        }).join('')}
      </div>
      <div class="card-footer">
        <span class="subtotal">在庫 ${totalForColor(design,color)} 枚　制作予定 ${totalPlannedForColor(design,color)} 枚</span>
        <button class="remove-btn" data-remove-color="${color}">削除</button>
      </div>
    </div>`;
  });

  if(Object.keys(state.designs).length > 1){
    html += `<button class="delete-design-btn" data-remove-design="${design}">「${design}」を削除</button>`;
  }

  app.innerHTML = html;

  const starPriorityBtn = document.getElementById('star-priority-btn');
  if(starPriorityBtn){
    starPriorityBtn.addEventListener('click', () => {
      d.starred = !d.starred;
      renderTabs();
      render();
      save();
    });
  }

  app.querySelectorAll('input[data-planned-color]').forEach(input => {
    const updatePlannedValue = () => {
      const color = input.getAttribute('data-planned-color');
      const size = input.getAttribute('data-planned-size');
      const value = Math.max(0, parseInt(input.value, 10) || 0);
      d.planned[color][size] = value;
      renderProductionSummary();
      saveLocal();
    };
    input.addEventListener('input', updatePlannedValue);
    input.addEventListener('change', () => {
      updatePlannedValue();
      save();
      render();
    });
  });

  app.querySelectorAll('button[data-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      const color = btn.getAttribute('data-color');
      const size = btn.getAttribute('data-size');
      const delta = parseInt(btn.getAttribute('data-delta'));
      const next = Math.max(0, (d.stock[color][size] || 0) + delta);
      d.stock[color][size] = next;
      renderTabs();
      render();
      save();
    });
  });

  app.querySelectorAll('button[data-remove-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      const color = btn.getAttribute('data-remove-color');
      d.colors = d.colors.filter(c => c !== color);
      delete d.stock[color];
      if(d.planned) delete d.planned[color];
      render();
      save();
    });
  });

  const removeDesignBtn = app.querySelector('button[data-remove-design]');
  if(removeDesignBtn){
    removeDesignBtn.addEventListener('click', () => {
      const name = removeDesignBtn.getAttribute('data-remove-design');
      delete state.designs[name];
      const remaining = Object.keys(state.designs);
      state.activeDesign = remaining[0];
      renderTabs();
      render();
      save();
    });
  }
}

document.getElementById('add-color-btn').addEventListener('click', () => {
  const input = document.getElementById('new-color');
  const val = input.value.trim();
  const d = state.designs[state.activeDesign];
  input.classList.remove('error');
  if(!val){
    input.classList.add('error');
    input.placeholder = '色の名前を入力してください';
    return;
  }
  if(d.colors.includes(val)){
    input.classList.add('error');
    return;
  }
  d.colors.push(val);
  input.value = '';
  render();
  save();
});
document.getElementById('new-color').addEventListener('input', (e) => { e.target.classList.remove('error'); });

document.getElementById('add-design-btn').addEventListener('click', () => {
  const input = document.getElementById('new-design');
  const val = input.value.trim();
  input.classList.remove('error');
  if(!val){
    input.classList.add('error');
    input.placeholder = 'デザイン名を入力してください';
    return;
  }
  if(state.designs[val]){
    input.classList.add('error');
    return;
  }
  state.designs[val] = { colors: [...DEFAULT_COLORS], stock: {}, planned: {}, starred: false };
  state.activeDesign = val;
  input.value = '';
  renderTabs();
  render();
  save();
});
document.getElementById('new-design').addEventListener('input', (e) => { e.target.classList.remove('error'); });

document.getElementById('sort-mode').addEventListener('change', (e) => {
  state.sortMode = e.target.value;
  renderTabs();
  saveLocal();
});

document.getElementById('export-inventory-btn').addEventListener('click', exportInventoryCsv);

async function init(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.designs) state = parsed;
    }
    const uiRaw = localStorage.getItem(UI_STORAGE_KEY);
    if(uiRaw){
      const ui = JSON.parse(uiRaw);
      if(ui.activeDesign) state.activeDesign = ui.activeDesign;
      if(ui.sortMode) state.sortMode = ui.sortMode;
    }
  } catch(e) {
    console.log('no existing local data, using defaults');
  }

  if(!state.sortMode) state.sortMode = 'priority';
  Object.values(state.designs).forEach(d => {
    if(d.starred == null) d.starred = Number(d.priority) === 1;
    if(!d.planned) d.planned = {};
  });
  if(!state.designs[state.activeDesign]) state.activeDesign = Object.keys(state.designs)[0];
  document.getElementById('sort-mode').value = state.sortMode;

  renderTabs();
  render();

  try {
    setSyncStatus('Firebaseに接続しています…');
    const snap = await getDoc(sharedRef);

    if(snap.exists() && snap.data()?.designs){
      state.designs = snap.data().designs;
      Object.values(state.designs).forEach(d => {
        if(d.starred == null) d.starred = false;
        if(!d.planned) d.planned = {};
      });
      if(!state.designs[state.activeDesign]) state.activeDesign = Object.keys(state.designs)[0];
      saveLocal();
    } else {
      await setDoc(sharedRef, {
        designs: state.designs,
        updatedAt: serverTimestamp()
      });
    }

    cloudReady = true;
    setSyncStatus('共有済み', 'ok');
    renderTabs();
    render();

    onSnapshot(sharedRef, (snapshot) => {
      if(!snapshot.exists() || !snapshot.data()?.designs) return;
      state.designs = snapshot.data().designs;
      Object.values(state.designs).forEach(d => {
        if(d.starred == null) d.starred = false;
        if(!d.planned) d.planned = {};
      });
      if(!state.designs[state.activeDesign]) state.activeDesign = Object.keys(state.designs)[0];
      saveLocal();
      renderTabs();
      render();
      setSyncStatus(snapshot.metadata.hasPendingWrites ? '同期中…' : '共有済み', snapshot.metadata.hasPendingWrites ? '' : 'ok');
    }, (error) => {
      console.error('snapshot error', error);
      setSyncStatus('同期エラー：Firestoreの設定を確認してください', 'error');
    });
  } catch(e) {
    console.error('firebase init failed', e);
    setSyncStatus('同期エラー：Firestore Databaseを作成し、ルールを確認してください', 'error');
  }
}

init();
</script>
</body>
</html>
