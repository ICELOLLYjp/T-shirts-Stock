<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<title>Tシャツ イベント棚卸</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--line:#e2e0d8;--text:#1f1e1c;--sub:#6b6a64;--muted:#96948c;--accent:#185fa5;--accent-soft:#e6f1fb;--danger:#a32d2d;--ok:#237a43;--warm:#fff8df;--warm-line:#ead796}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:820px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 12px max(40px,calc(env(safe-area-inset-bottom) + 24px))}h1{font-size:22px;margin:0}.sub{color:var(--sub);font-size:13px;line-height:1.55;margin-top:5px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.btn,select,input{font:inherit}.btn{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-weight:700;padding:0 13px}.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:disabled{opacity:.45}.select,.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font-size:16px}.status{font-size:12px;color:var(--sub);margin-top:7px;line-height:1.5}.status.ok{color:var(--ok);font-weight:700}.status.err{color:var(--danger);font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--sub)}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.filterbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:10px}.sort-note{font-size:11px;color:var(--sub);white-space:nowrap}.matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}.matrix{min-width:740px}.mrow,.mhead{display:grid;grid-template-columns:190px repeat(5,110px);border-bottom:1px solid var(--line)}.mhead{position:sticky;top:0;background:#f8f8f5;z-index:3;font-size:12px;font-weight:800}.name{position:sticky;left:0;z-index:2;background:#fff;padding:9px;border-right:1px solid var(--line)}.mhead .name{background:#f8f8f5;z-index:4}.mrow.stocked .name{background:var(--warm)}.sizeh{padding:11px 3px;text-align:center}.design{font-weight:800;font-size:14px;line-height:1.25;overflow-wrap:anywhere}.detail{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.35}.badge{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:800;background:#f0f0ec;color:var(--sub)}.badge.stocked{background:#fff0b8;color:#7b5d00}.badge.registered{background:var(--accent-soft);color:var(--accent)}.cell{border-left:1px solid #efefe9;padding:7px 5px;display:grid;gap:5px;align-content:center;min-height:120px}.open{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}.step{display:grid;grid-template-columns:1fr 1fr;gap:5px;align-items:center}.step .qty{grid-column:1/-1;grid-row:1}.step button:first-child{grid-column:1;grid-row:2}.step button:last-child{grid-column:2;grid-row:2}.step button{height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:24px;font-weight:800;padding:0;color:var(--accent);touch-action:manipulation}.step button:active{transform:scale(.96);background:var(--accent-soft)}.qty{width:100%;height:46px;min-width:0;text-align:center;border:1px solid var(--line);border-radius:9px;font-size:18px;font-weight:800;background:#fff;color:var(--text)}.missing{display:flex;align-items:center;justify-content:center;color:#bbb;background:#f5f5f2}.note{font-size:12px;color:var(--sub);line-height:1.55}.warning{background:var(--warm);border:1px solid var(--warm-line);border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:10px}.hidden{display:none!important}.group-hidden{display:none!important}
@media(max-width:560px){.app{padding-left:8px;padding-right:8px}.summary{grid-template-columns:repeat(3,1fr)}.stat{padding:8px}.stat strong{font-size:19px}.tools{grid-template-columns:1fr 1fr}.filterbar{grid-template-columns:1fr}.sort-note{white-space:normal}.matrix{min-width:680px}.mrow,.mhead{grid-template-columns:145px repeat(5,106px)}.name{padding:8px}.design{font-size:13px}.cell{min-height:116px;padding:6px 5px}.step button{height:42px}.qty{height:44px;font-size:18px}}
</style>
</head>
<body><main class="app">
<div class="row"><div class="grow"><h1>イベント棚卸</h1><div class="sub">Tシャツのイベント終了実数を数えます。全SKUを表示し、開始在庫がある商品を上に並べます。</div></div><a class="btn" style="display:flex;align-items:center;text-decoration:none" href="./">通常在庫</a></div>
<section id="authCard" class="card"><div id="authText" class="note">Googleログインを確認しています…</div><button id="loginButton" class="btn primary hidden" type="button" style="width:100%;margin-top:10px">Googleでログイン</button></section>
<section id="mainPanel" class="hidden">
<div class="card"><label class="note" for="sessionSelect">イベント</label><select id="sessionSelect" class="select"><option value="">イベントを選択</option></select><div id="eventMeta" class="status"></div></div>
<div id="countPanel" class="hidden">
<div class="card summary"><div class="stat"><strong id="targetStat">0</strong><span>対象SKU</span></div><div class="stat"><strong id="qtyStat">0</strong><span>終了点数</span></div><div class="stat"><strong id="openingStat">0</strong><span>開始点数</span></div></div>
<div class="card">
<div class="row"><div class="grow"><strong>終了実数を入力</strong><div class="note">未入力は0として扱います。開始在庫あり → 登録SKU → その他SKUの順です。</div></div><button id="reloadButton" class="btn" type="button">再読込</button></div>
<div class="tools"><button id="copyOpeningButton" class="btn" type="button">開始数をコピー</button><button id="zeroAllButton" class="btn" type="button">すべて0</button></div>
<div class="filterbar"><input id="searchInput" class="search" type="search" placeholder="Design / Body / Colorを検索"><div id="sortNote" class="sort-note"></div></div>
<div id="matrixWrap" class="matrix-wrap"><div id="matrix" class="matrix"></div></div>
<div id="draftInfo" class="status"></div>
<div class="tools"><button id="saveDraftButton" class="btn" type="button">途中保存</button><button id="confirmButton" class="btn accent" type="button">棚卸を確定</button></div><div id="message" class="status"></div>
</div></div></section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyA1AZlnCYr5cfHG3HDcyvG17jokBnr5lO8",authDomain:"t-shirtstock.firebaseapp.com",projectId:"t-shirtstock",storageBucket:"t-shirtstock.firebasestorage.app",messagingSenderId:"485805702075",appId:"1:485805702075:web:f9d8668ca57d9f58c4229e",measurementId:"G-TXEHB9FGSR"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);const provider=new GoogleAuthProvider();const SIZE_ORDER=["S","M","L","XL","XXL"];const $=id=>document.getElementById(id);let user=null,sessions=[],session=null,rows=[],values=new Map(),searchText="";
function n(v){const x=Number(v);return Number.isFinite(x)?Math.max(0,Math.floor(x)):0}function text(v){return String(v??"").trim()}function esc(v){return text(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}function enc(v){return encodeURIComponent(text(v))}function variantId(bodyId,designId,colorId,sizeId){return["tshirt",enc(bodyId),enc(designId),enc(colorId),enc(sizeId)].join("__")}function inventoryKey(bodyId,designId,colorId,sizeId){return`tshirt:${enc(bodyId)}|${enc(designId)}|${enc(colorId)}|${enc(sizeId)}`}function parseDetail(value){const p=text(value).split("/").map(x=>x.trim());return{body:p[0]||"",color:p[1]||"",size:p[2]||""}}function displayName(map,id,fields){const item=map?.[id]||{};for(const field of fields){const value=text(item?.[field]);if(value)return value}return id||""}function timestampText(value){try{if(value?.toDate)return value.toDate().toLocaleString("ja-JP")}catch{}return ""}function setMessage(msg,type=""){const el=$("message");el.textContent=msg;el.className=`status ${type}`.trim()}
async function loadSessions(){const snap=await getDocs(collection(db,"salesSessions"));sessions=snap.docs.map(d=>({sessionId:d.id,...d.data()})).filter(s=>(s.status==="open"||s.status==="pending_allocation")&&Array.isArray(s?.inventoryCount?.opening?.items));sessions.sort((a,b)=>text(b.startDate).localeCompare(text(a.startDate)));$("sessionSelect").innerHTML='<option value="">イベントを選択</option>'+sessions.map(s=>`<option value="${esc(s.sessionId)}">${esc(s.eventName||s.sessionId)}${s.status==="pending_allocation"?"（仮終了中）":""}</option>`).join("");const requested=new URLSearchParams(location.search).get("session");if(requested&&sessions.some(s=>s.sessionId===requested)){$("sessionSelect").value=requested;await chooseSession(requested)}}
function masterRows(master){const m=master?.masters||{},bodies=m.bodies||{},designs=m.designs||{},colors=m.colors||{},sizes=m.sizes||{},result=[];Object.entries(master?.inventory_v2||{}).forEach(([bodyId,designTree])=>{if(bodyId==="body_unassigned")return;Object.entries(designTree||{}).forEach(([designId,colorTree])=>Object.entries(colorTree||{}).forEach(([colorId,sizeTree])=>Object.entries(sizeTree||{}).forEach(([sizeId])=>result.push({variantId:variantId(bodyId,designId,colorId,sizeId),category:"tshirt",inventorySource:"tshirt",inventoryKey:inventoryKey(bodyId,designId,colorId,sizeId),sku:variantId(bodyId,designId,colorId,sizeId),bodyId,designId,colorId,sizeId,body:displayName(bodies,bodyId,["managementName","salesName"]),design:displayName(designs,designId,["managementName","legacyKey","salesName"]),color:displayName(colors,colorId,["managementName","legacyKey","pinkoiName"]),size:displayName(sizes,sizeId,["managementName","salesName"]),sizeOrder:Number(sizes?.[sizeId]?.order||999)}))))});return result}
function buildRows(data,master,variantDocs){const opening=(data?.inventoryCount?.opening?.items||[]).filter(item=>item.category==="tshirt"&&item.inventorySource==="tshirt"),openingMap=new Map(opening.map(item=>[item.variantId,item])),closingMap=new Map((data?.inventoryCount?.closing?.items||[]).map(item=>[item.variantId,item])),draftMap=new Map((data?.inventoryCount?.externalCounts?.tshirt?.draftItems||[]).map(item=>[item.variantId,item])),variantMap=new Map(variantDocs.filter(v=>v.category==="tshirt"&&v.inventorySource==="tshirt"&&v.active!==false).map(v=>[v.variantId||v.id,v])),all=new Map();masterRows(master).forEach(row=>all.set(row.variantId,row));variantMap.forEach((v,id)=>{if(all.has(id))return;const target=text(v.inventoryKey).startsWith("tshirt:")?text(v.inventoryKey).slice(7).split("|").map(x=>decodeURIComponent(x)):[];all.set(id,{variantId:id,category:"tshirt",inventorySource:"tshirt",inventoryKey:v.inventoryKey||"",sku:v.sku||id,bodyId:v.bodyId||target[0]||"",designId:v.designId||target[1]||"",colorId:v.colorId||target[2]||"",sizeId:v.sizeId||target[3]||"",body:v.body||"",design:v.design||v.displayName||"Tシャツ",color:v.color||"",size:v.size||"",sizeOrder:Number(v.sizeOrder||999)})});opening.forEach(item=>{if(all.has(item.variantId))return;const d=parseDetail(item.detail);all.set(item.variantId,{...item,body:d.body,color:d.color,size:d.size,design:item.label||"Tシャツ",sizeOrder:SIZE_ORDER.indexOf(d.size)})});rows=[...all.values()].map(base=>{const open=openingMap.get(base.variantId),d=open?parseDetail(open.detail):null,v=variantMap.get(base.variantId);return{...base,label:open?.label||base.design||v?.design||v?.displayName||"Tシャツ",body:open?d.body:(base.body||v?.body||""),color:open?d.color:(base.color||v?.color||""),size:open?d.size:(base.size||v?.size||""),detail:open?.detail||[base.body||v?.body,base.color||v?.color,base.size||v?.size].filter(Boolean).join(" / "),openingQty:n(open?.openingQty),registered:variantMap.has(base.variantId),inOpening:openingMap.has(base.variantId),closing:closingMap.get(base.variantId)||null,draft:draftMap.get(base.variantId)||null}});values=new Map();rows.forEach(row=>{const source=row.draft||row.closing;values.set(row.variantId,source&&source.closingQty!==null&&source.closingQty!==undefined&&source.closingQty!==""?n(source.closingQty):0)})}
function groups(){const map=new Map();rows.forEach(row=>{const key=[row.label,row.body,row.color].join("||");if(!map.has(key))map.set(key,{design:row.label||"Tシャツ",body:row.body,color:row.color,items:[],openingTotal:0,registered:false});const g=map.get(key);g.items.push(row);g.openingTotal+=n(row.openingQty);g.registered=g.registered||row.registered});return[...map.values()].sort((a,b)=>(b.openingTotal>0)-(a.openingTotal>0)||(b.registered?1:0)-(a.registered?1:0)||a.design.localeCompare(b.design,"ja")||a.body.localeCompare(b.body,"ja")||a.color.localeCompare(b.color,"ja"))}
function render(){const head=`<div class="mhead"><div class="name">Design / Body / Color</div>${SIZE_ORDER.map(s=>`<div class="sizeh">${s}</div>`).join("")}</div>`,q=searchText.toLocaleLowerCase("ja"),body=groups().map(g=>{const match=!q||`${g.design} ${g.body} ${g.color}`.toLocaleLowerCase("ja").includes(q),badge=g.openingTotal>0?'<span class="badge stocked">開始在庫あり</span>':g.registered?'<span class="badge registered">登録SKU</span>':'<span class="badge">その他SKU</span>';return`<div class="mrow ${g.openingTotal>0?"stocked":""} ${match?"":"group-hidden"}"><div class="name"><div class="design">${esc(g.design)}</div><div class="detail">${esc([g.body,g.color].filter(Boolean).join(" / "))}</div>${badge}</div>${SIZE_ORDER.map(size=>{const item=g.items.find(x=>x.size===size);if(!item)return'<div class="cell missing">—</div>';const value=n(values.get(item.variantId));return`<div class="cell"><div class="open">開始 ${n(item.openingQty)}</div><div class="step"><button type="button" data-step="-1" data-id="${esc(item.variantId)}">−</button><input class="qty" data-id="${esc(item.variantId)}" type="number" inputmode="numeric" min="0" step="1" value="${value}"><button type="button" data-step="1" data-id="${esc(item.variantId)}">＋</button></div></div>`}).join("")}</div>`}).join("");$("matrix").innerHTML=head+body;bindInputs();updateSummary();const ext=session?.inventoryCount?.externalCounts?.tshirt;$("draftInfo").textContent=ext?.status==="confirmed"?`前回確定: ${timestampText(ext.confirmedAt)||"保存済み"}`:ext?.status==="draft"?`途中保存あり: ${timestampText(ext.savedAt)||"保存済み"}`:"";$("sortNote").textContent=`全 ${rows.length} SKU / 開始在庫あり ${rows.filter(r=>n(r.openingQty)>0).length} SKU`}
function bindInputs(){document.querySelectorAll(".qty").forEach(input=>input.addEventListener("input",()=>{values.set(input.dataset.id,n(input.value));if(input.value==="")input.value="0";updateSummary()}));document.querySelectorAll("[data-step]").forEach(btn=>btn.addEventListener("click",()=>{const id=btn.dataset.id,next=Math.max(0,n(values.get(id))+Number(btn.dataset.step));values.set(id,next);const input=document.querySelector(`.qty[data-id="${CSS.escape(id)}"]`);if(input)input.value=String(next);updateSummary()}))}function updateSummary(){$("targetStat").textContent=rows.length;$("qtyStat").textContent=[...values.values()].reduce((s,v)=>s+n(v),0);$("openingStat").textContent=rows.reduce((s,r)=>s+n(r.openingQty),0)}function itemsFromValues(){return rows.map(row=>({variantId:row.variantId,closingQty:n(values.get(row.variantId))}))}
async function chooseSession(id){setMessage("");const [snap,masterSnap,variantSnap]=await Promise.all([getDoc(doc(db,"salesSessions",id)),getDoc(doc(db,"tshirtStock","master")),getDocs(collection(db,"productVariants"))]);if(!snap.exists())throw new Error("イベントが見つかりません。");if(!masterSnap.exists())throw new Error("Tシャツ在庫マスターが見つかりません。");session={sessionId:id,...snap.data()};buildRows(session,masterSnap.data(),variantSnap.docs.map(d=>({id:d.id,...d.data()})));$("eventMeta").textContent=[session.eventName,session.city,session.country,session.startDate&&session.endDate?`${session.startDate}〜${session.endDate}`:""].filter(Boolean).join(" / ");$("countPanel").classList.toggle("hidden",!rows.length);if(!rows.length){$("eventMeta").textContent+=" / TシャツSKUがありません";return}render()}
async function saveDraft(){if(!session)return;setMessage("保存中…");const items=itemsFromValues();await updateDoc(doc(db,"salesSessions",session.sessionId),{"inventoryCount.externalCounts.tshirt":{status:"draft",source:"tshirt_stock_app",savedAt:serverTimestamp(),savedByEmail:user?.email||"",draftItems:items,totalSkuCount:items.length},"inventoryCount.updatedAt":serverTimestamp(),updatedAt:serverTimestamp()});setMessage("途中保存しました。Sales Managerの終了在庫にはまだ反映していません。","ok");await chooseSession(session.sessionId)}
async function confirmCount(){if(!session)return;const items=itemsFromValues();if(!confirm(`Tシャツ ${items.length} SKU、終了合計 ${items.reduce((s,x)=>s+n(x.closingQty),0)} 点で棚卸を確定しますか？`))return;setMessage("確定中…");const ref=doc(db,"salesSessions",session.sessionId);await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw new Error("イベントが見つかりません。");const current=snap.data();if(current.status!=="open"&&current.status!=="pending_allocation")throw new Error("正式終了済みイベントは変更できません。");const currentOpening=current?.inventoryCount?.opening?.items||[],openingIds=new Set(currentOpening.map(x=>x.variantId)),completedOpening=[...currentOpening];rows.forEach(row=>{if(openingIds.has(row.variantId))return;completedOpening.push({variantId:row.variantId,category:"tshirt",inventorySource:"tshirt",inventoryKey:row.inventoryKey||"",sku:row.sku||row.variantId,label:row.label||"Tシャツ",detail:row.detail||[row.body,row.color,row.size].filter(Boolean).join(" / "),openingQty:0});openingIds.add(row.variantId)});const tshirtIds=new Set(rows.map(r=>r.variantId)),existing=current?.inventoryCount?.closing?.items||[],existingMap=new Map(existing.map(x=>[x.variantId,x])),preserved=existing.filter(x=>!tshirtIds.has(x.variantId)),mergedTshirt=items.map(x=>({...existingMap.get(x.variantId),variantId:x.variantId,closingQty:n(x.closingQty),loss:n(existingMap.get(x.variantId)?.loss),theft:n(existingMap.get(x.variantId)?.theft),damage:n(existingMap.get(x.variantId)?.damage),gift:n(existingMap.get(x.variantId)?.gift),sample:n(existingMap.get(x.variantId)?.sample),stockAdjustment:Number(existingMap.get(x.variantId)?.stockAdjustment||0)})),totalQty=mergedTshirt.reduce((s,x)=>s+n(x.closingQty),0);tx.update(ref,{"inventoryCount.opening.items":completedOpening,"inventoryCount.closing":{savedAt:serverTimestamp(),savedByEmail:user?.email||"",items:[...preserved,...mergedTshirt]},"inventoryCount.externalCounts.tshirt":{status:"confirmed",source:"tshirt_stock_app",confirmedAt:serverTimestamp(),confirmedByEmail:user?.email||"",countedCount:mergedTshirt.length,totalSkuCount:mergedTshirt.length,totalQty},"inventoryCount.updatedAt":serverTimestamp(),updatedAt:serverTimestamp()})});setMessage("棚卸を確定しました。Sales Managerの終了在庫へ反映済みです。","ok");await chooseSession(session.sessionId)}
$("loginButton").addEventListener("click",()=>signInWithPopup(auth,provider));$("sessionSelect").addEventListener("change",e=>e.target.value?chooseSession(e.target.value):$("countPanel").classList.add("hidden"));$("reloadButton").addEventListener("click",()=>session&&chooseSession(session.sessionId));$("copyOpeningButton").addEventListener("click",()=>{rows.forEach(r=>values.set(r.variantId,n(r.openingQty)));render()});$("zeroAllButton").addEventListener("click",()=>{rows.forEach(r=>values.set(r.variantId,0));render()});$("searchInput").addEventListener("input",e=>{searchText=text(e.target.value);render()});$("saveDraftButton").addEventListener("click",()=>saveDraft().catch(e=>setMessage(e.message||String(e),"err")));$("confirmButton").addEventListener("click",()=>confirmCount().catch(e=>setMessage(e.message||String(e),"err")));
onAuthStateChanged(auth,async current=>{user=current;$("authText").textContent=current?`ログイン中: ${current.email||""}`:"イベント棚卸を使うにはログインしてください。";$("loginButton").classList.toggle("hidden",Boolean(current));$("mainPanel").classList.toggle("hidden",!current);if(current){try{await loadSessions()}catch(e){$("authText").textContent=`読込エラー: ${e.message||e}`}}});
</script></body></html>
