<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<title>Tシャツ イベント棚卸</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--line:#e2e0d8;--text:#1f1e1c;--sub:#6b6a64;--accent:#185fa5;--accent-soft:#e6f1fb;--danger:#a32d2d;--ok:#237a43;--warm:#fff8df;--warm-line:#ead796;--unknown:#f2eee4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:860px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 10px max(42px,calc(env(safe-area-inset-bottom) + 26px))}h1{font-size:22px;margin:0}.sub,.note,.status{font-size:12px;line-height:1.5;color:var(--sub)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.btn,select,input{font:inherit}.btn{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-weight:800;padding:0 12px}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45}.select,.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font-size:16px}.hidden{display:none!important}.status{margin-top:7px}.status.ok{color:var(--ok);font-weight:800}.status.err{color:var(--danger);font-weight:800}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.stat{border:1px solid var(--line);border-radius:11px;padding:8px;background:#fff}.stat strong{display:block;font-size:20px}.stat span{font-size:10px;color:var(--sub)}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}.checkpoint-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.checkpoint{background:#f5fbfa}.filterbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:10px}.sort-note{font-size:11px;color:var(--sub)}.matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}.matrix{min-width:760px}.mrow,.mhead{display:grid;grid-template-columns:180px repeat(5,116px);border-bottom:1px solid var(--line)}.mhead{position:sticky;top:0;z-index:4;background:#f8f8f5;font-size:12px;font-weight:900}.name{position:sticky;left:0;z-index:2;background:#fff;padding:8px;border-right:1px solid var(--line)}.mhead .name{background:#f8f8f5;z-index:5}.mrow.stocked .name{background:var(--warm)}.sizeh{padding:10px 2px;text-align:center}.design{font-size:13px;font-weight:900;line-height:1.25}.detail{font-size:10px;color:var(--sub);margin-top:3px}.badge{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:999px;font-size:9px;font-weight:900;background:#eee;color:#666}.badge.stocked{background:#fff0b8;color:#7b5d00}.badge.registered{background:var(--accent-soft);color:var(--accent)}.cell{border-left:1px solid #efefe9;padding:6px 5px;display:grid;gap:4px;align-content:center;min-height:154px}.cell.unknown{background:var(--unknown)}.open{font-size:10px;color:#777;text-align:center}.qty{width:100%;height:43px;border:1px solid var(--line);border-radius:9px;text-align:center;font-size:18px;font-weight:900;background:#fff}.qty::placeholder{color:#856f45;font-size:13px}.step,.state-tools{display:grid;grid-template-columns:1fr 1fr;gap:4px}.step button{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:22px;font-weight:900;color:var(--accent)}.state-btn{min-height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:10px;font-weight:900}.state-btn.active{background:#74664e;color:#fff;border-color:#74664e}.state-btn.zero.active{background:var(--accent);border-color:var(--accent)}.missing{display:flex;align-items:center;justify-content:center;color:#bbb;background:#f5f5f2}.group-hidden{display:none!important}.warning{margin-top:8px;padding:9px;border:1px solid var(--warm-line);border-radius:10px;background:var(--warm);font-size:11px;line-height:1.5}
@media(max-width:560px){.app{padding-left:7px;padding-right:7px}.summary{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr 1fr}.matrix{min-width:700px}.mrow,.mhead{grid-template-columns:145px repeat(5,110px)}.cell{min-height:150px}.name{padding:7px}.filterbar{grid-template-columns:1fr}.sort-note{white-space:normal}}
</style>
</head>
<body><main class="app">
<div class="row"><div class="grow"><h1>Tシャツ イベント棚卸</h1><div class="sub">0 と「不明」を別々に記録します。不明を0へ自動変換しません。</div></div><a class="btn" style="display:flex;align-items:center;text-decoration:none" href="./">通常在庫</a></div>
<section class="card"><div id="authText" class="note">Googleログインを確認しています…</div><button id="loginButton" class="btn hidden" type="button" style="width:100%;margin-top:9px">Googleでログイン</button></section>
<section id="mainPanel" class="hidden">
<div class="card"><label class="note" for="sessionSelect">イベント</label><select id="sessionSelect" class="select"><option value="">イベントを選択</option></select><div id="eventMeta" class="status"></div></div>
<div id="countPanel" class="hidden">
<div class="card summary"><div class="stat"><strong id="knownStat">0</strong><span>確認済SKU</span></div><div class="stat"><strong id="unknownStat">0</strong><span>不明SKU</span></div><div class="stat"><strong id="qtyStat">0</strong><span>確認済点数</span></div><div class="stat"><strong id="openingStat">0</strong><span>開始点数</span></div></div>
<div class="card checkpoint"><strong>途中カウント / 日次締め</strong><div class="note">確認したSKUだけ保存できます。何も数えていない日でも日次記録を残せます。不明は不明のままです。</div><div class="checkpoint-tools"><button id="saveCheckpointButton" class="btn" type="button">途中カウント保存</button><button id="saveDailyButton" class="btn" type="button">日次締め保存</button></div></div>
<div class="card"><div class="row"><div class="grow"><strong>実数を入力</strong><div class="note">数字を入れると「確認済」。数量0は「0」ボタン。不明は「不明」ボタン。</div></div><button id="reloadButton" class="btn" type="button">再読込</button></div>
<div class="tools"><button id="copyOpeningButton" class="btn" type="button">開始数をコピー</button><button id="zeroAllButton" class="btn" type="button">全部0</button><button id="unknownAllButton" class="btn" type="button">全部不明</button></div>
<div class="warning">「0」は実際に0点と確認した状態です。「不明」は未確認です。終了時も不明のまま残せます。</div>
<div class="filterbar"><input id="searchInput" class="search" type="search" placeholder="Design / Body / Colorを検索"><div id="sortNote" class="sort-note"></div></div>
<div class="matrix-wrap"><div id="matrix" class="matrix"></div></div><div id="draftInfo" class="status"></div>
<div class="checkpoint-tools"><button id="saveDraftButton" class="btn" type="button">途中保存</button><button id="confirmButton" class="btn accent" type="button">棚卸を確定</button></div><div id="message" class="status"></div></div>
</div></section>
</main><script type="module" src="./event-count-v2.js?v=20260916-unknown-zero-1"></script></body></html>
