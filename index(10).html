<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA1AZlnCYr5cfHG3HDcyvG17jokBnr5lO8",
  authDomain: "t-shirtstock.firebaseapp.com",
  projectId: "t-shirtstock",
  storageBucket: "t-shirtstock.firebasestorage.app",
  messagingSenderId: "485805702075",
  appId: "1:485805702075:web:f9d8668ca57d9f58c4229e",
  measurementId: "G-TXEHB9FGSR"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const sharedRef = doc(db, 'tshirtStock', 'shared');
const masterRef = doc(db, 'tshirtStock', 'master');

const SIZES = ['S','M','L','XL','XXL'];
const STORAGE_KEY = 'tshirt-stock-by-design';
const UI_STORAGE_KEY = 'tshirt-stock-ui';
const PRE_V2_BACKUP_KEY = 'tshirt-stock-pre-v2-backup';
const SCHEMA_VERSION = 2;
const LEGACY_BODY_ID = 'body_unassigned';
let cloudReady = false;
let sharedDocument = null;
let masterDocument = null;
let masterReady = false;
let masterError = null;
let cloudSaveTimer = null;

const DEFAULT_COLORS = ['ナチュラル','ブラック','グリーン','パープル','ピンク','ベージュ','VB','VN','VP','VG'];
const DEFAULT_DESIGNS = ['Bigwave','Share the pavement','Gull','Sink','Rays','Cherry','Squids','Whole ocean dive club','See you in water','DEEP','Safe Surf','SALTY'];


function stableId(prefix, name){
  let hash = 2166136261;
  const source = String(name ?? '');
  for(let i = 0; i < source.length; i++){
    hash ^= source.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return `${prefix}_${(hash >>> 0).toString(36)}`;
}

function nowIso(){
  return new Date().toISOString();
}

function formatTimestamp(value){
  if(!value) return '未記録';
  let date = null;
  if(typeof value?.toDate === 'function') date = value.toDate();
  else if(value instanceof Date) date = value;
  else if(typeof value === 'string' || typeof value === 'number') date = new Date(value);
  else if(value?.seconds != null) date = new Date(Number(value.seconds) * 1000);
  if(!date || Number.isNaN(date.getTime())) return '未記録';
  return new Intl.DateTimeFormat('ja-JP', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }).format(date);
}

function renderLastUpdated(value){
  const el = document.getElementById('last-updated');
  if(el) el.textContent = `最終更新：${formatTimestamp(value)}`;
}

function normalizedForJson(value){
  if(value == null) return value;
  if(typeof value?.toDate === 'function') return value.toDate().toISOString();
  if(Array.isArray(value)) return value.map(normalizedForJson);
  if(typeof value === 'object'){
    const out = {};
    Object.entries(value).forEach(([k,v]) => out[k] = normalizedForJson(v));
    return out;
  }
  return value;
}

function downloadText(filename, text, mime){
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function timestampForFilename(){
  const n = new Date();
  const pad = v => String(v).padStart(2,'0');
  return `${n.getFullYear()}${pad(n.getMonth()+1)}${pad(n.getDate())}_${pad(n.getHours())}${pad(n.getMinutes())}`;
}

function exportJsonBackup(){
  let preV2Backup = null;
  try {
    const raw = localStorage.getItem(PRE_V2_BACKUP_KEY);
    if(raw) preV2Backup = JSON.parse(raw);
  } catch(e){
    console.error('read pre v2 backup failed', e);
  }
  const payload = {
    exportedAt: nowIso(),
    source: sharedDocument ? 'Firestore tshirtStock/shared + tshirtStock/master + local UI' : 'local only',
    firestoreShared: normalizedForJson(sharedDocument),
    firestoreMaster: normalizedForJson(masterDocument),
    masterError: masterError ? { code: masterError.code || '', message: masterError.message || String(masterError) } : null,
    preV2Backup: normalizedForJson(preV2Backup),
    localState: normalizedForJson(state)
  };
  downloadText(
    `tshirt_stock_backup_${timestampForFilename()}.json`,
    JSON.stringify(payload, null, 2),
    'application/json;charset=utf-8'
  );
}

function createPreV2LocalBackup(docData){
  try {
    if(localStorage.getItem(PRE_V2_BACKUP_KEY)) return;
    localStorage.setItem(PRE_V2_BACKUP_KEY, JSON.stringify({
      createdAt: nowIso(),
      firestore: normalizedForJson(docData),
      localState: normalizedForJson(state)
    }));
  } catch(e){
    console.error('pre v2 backup failed', e);
  }
}

function buildV2SchemaFromLegacy(designs){
  const sourceDesigns = designs || {};
  const migratedAt = nowIso();

  const bodies = {
    [LEGACY_BODY_ID]: {
      id: LEGACY_BODY_ID,
      managementName: '未設定',
      salesName: '',
      legacy: true,
      createdAt: migratedAt
    }
  };
  const designMasters = {};
  const colorMasters = {};
  const sizeMasters = {};
  const inventory = { [LEGACY_BODY_ID]: {} };
  const productionPlan = { [LEGACY_BODY_ID]: {} };

  SIZES.forEach((size, index) => {
    const id = size.toLowerCase();
    sizeMasters[id] = {
      id,
      managementName: size,
      salesName: size,
      order: index + 1
    };
  });

  Object.entries(sourceDesigns).forEach(([designName, d]) => {
    const designId = stableId('design', designName);
    designMasters[designId] = {
      id: designId,
      managementName: designName,
      salesName: designName,
      legacyKey: designName,
      starred: Boolean(d?.starred),
      createdAt: migratedAt
    };
    inventory[LEGACY_BODY_ID][designId] = {};
    productionPlan[LEGACY_BODY_ID][designId] = {};

    const colors = Array.isArray(d?.colors) ? d.colors : [];
    colors.forEach(colorName => {
      const colorId = stableId('color', colorName);
      if(!colorMasters[colorId]){
        colorMasters[colorId] = {
          id: colorId,
          managementName: colorName,
          pinkoiName: colorName,
          legacyKey: colorName,
          createdAt: migratedAt
        };
      }

      const stockSizes = {};
      const planSizes = {};
      let hasStock = false;
      let hasPlan = false;

      SIZES.forEach(size => {
        const sizeId = size.toLowerCase();
        const qty = Math.max(0, Number(d?.stock?.[colorName]?.[size] || 0));
        const planned = Math.max(0, Number(d?.planned?.[colorName]?.[size] || 0));

        if(qty > 0){
          stockSizes[sizeId] = { qty, updatedAt: migratedAt };
          hasStock = true;
        }
        if(planned > 0){
          planSizes[sizeId] = { qty: planned, updatedAt: migratedAt };
          hasPlan = true;
        }
      });

      if(hasStock) inventory[LEGACY_BODY_ID][designId][colorId] = stockSizes;
      if(hasPlan) productionPlan[LEGACY_BODY_ID][designId][colorId] = planSizes;
    });
  });

  return {
    schemaVersion: SCHEMA_VERSION,
    masters: {
      bodies,
      designs: designMasters,
      colors: colorMasters,
      sizes: sizeMasters
    },
    inventory_v2: inventory,
    production_plan_v2: productionPlan,
    blank_stock: {},
    print_sheets: {},
    migration: {
      from: 'designs',
      version: 1,
      migratedAt,
      legacyBodyId: LEGACY_BODY_ID,
      note: 'Existing stock copied without changing legacy designs. Body is temporarily unassigned.'
    }
  };
}


function buildMasterMirrorPatch(){
  const built = buildV2SchemaFromLegacy(state.designs);
  const currentMasters = masterDocument?.masters || {};

  const bodies = { ...(currentMasters.bodies || {}) };
  if(!bodies[LEGACY_BODY_ID]) bodies[LEGACY_BODY_ID] = built.masters.bodies[LEGACY_BODY_ID];

  const designs = { ...(currentMasters.designs || {}) };
  Object.entries(built.masters.designs).forEach(([id, item]) => {
    if(designs[id]){
      designs[id] = {
        ...item,
        ...designs[id],
        legacyKey: item.legacyKey,
        starred: item.starred
      };
    } else {
      designs[id] = item;
    }
  });

  const colors = { ...(currentMasters.colors || {}) };
  Object.entries(built.masters.colors).forEach(([id, item]) => {
    colors[id] = colors[id] ? { ...item, ...colors[id], legacyKey: item.legacyKey } : item;
  });

  const sizes = { ...(currentMasters.sizes || {}) };
  Object.entries(built.masters.sizes).forEach(([id, item]) => {
    if(!sizes[id]) sizes[id] = item;
  });

  return {
    schemaVersion: SCHEMA_VERSION,
    masters: { bodies, designs, colors, sizes },
    inventory_v2: {
      ...(masterDocument?.inventory_v2 || {}),
      [LEGACY_BODY_ID]: built.inventory_v2[LEGACY_BODY_ID]
    },
    production_plan_v2: {
      ...(masterDocument?.production_plan_v2 || {}),
      [LEGACY_BODY_ID]: built.production_plan_v2[LEGACY_BODY_ID]
    },
    blank_stock: masterDocument?.blank_stock || {},
    print_sheets: masterDocument?.print_sheets || {},
    migration: masterDocument?.migration || built.migration
  };
}

function schemaCounts(docData){
  const masters = docData?.masters || {};
  return {
    bodies: Object.keys(masters.bodies || {}).length,
    designs: Object.keys(masters.designs || {}).length,
    colors: Object.keys(masters.colors || {}).length,
    sizes: Object.keys(masters.sizes || {}).length
  };
}

function firestoreErrorText(error){
  if(!error) return '';
  const code = error.code ? String(error.code) : 'unknown';
  const message = error.message ? String(error.message) : String(error);
  return `${code}: ${message}`;
}

function renderSchemaStatus(docData = masterDocument, status = ''){
  const box = document.getElementById('schema-status');
  if(!box) return;

  if(status === 'loading'){
    box.innerHTML = `<div class="schema-card"><strong>マスターデータを確認中</strong><div class="schema-note">既存在庫は tshirtStock/shared のまま保護されています。</div></div>`;
    return;
  }

  if(masterError){
    const code = masterError.code || 'unknown';
    const detail = firestoreErrorText(masterError).replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const hint = code === 'permission-denied'
      ? 'Firestoreルールで tshirtStock/master の読み書きを許可してください。既存の在庫同期は shared で継続します。'
      : '既存の在庫同期は shared で継続します。エラー内容を確認してから master を再接続します。';
    box.innerHTML = `<div class="schema-card">
      <strong>マスター未接続</strong>
      <div class="schema-note">${hint}</div>
      <div class="schema-note" style="word-break:break-all;">${detail}</div>
    </div>`;
    return;
  }

  const version = Number(docData?.schemaVersion || 0);
  if(version < SCHEMA_VERSION){
    box.innerHTML = `<div class="schema-card"><strong>データ構造 v1</strong><div class="schema-note">既存在庫は保護されています。新しい master ドキュメントはまだ作成されていません。</div></div>`;
    return;
  }

  const c = schemaCounts(docData);
  box.innerHTML = `<div class="schema-card">
    <strong>データ構造 v2 準備済み</strong>
    <div>Body ${c.bodies} / Design ${c.designs} / Color ${c.colors} / Size ${c.sizes}</div>
    <div class="schema-note">既存在庫は tshirtStock/shared、マスターデータは tshirtStock/master に分離しています。既存在庫は v2 の「未設定」Body にコピー済みです。</div>
  </div>`;
}

async function ensureMasterDocument(){
  masterError = null;
  renderSchemaStatus(null, 'loading');
  try {
    const snap = await getDoc(masterRef);
    if(snap.exists()){
      masterDocument = snap.data();
      if(Number(masterDocument?.schemaVersion || 0) < SCHEMA_VERSION || !masterDocument?.masters || !masterDocument?.inventory_v2){
        const patch = buildMasterMirrorPatch();
        await setDoc(masterRef, {
          ...patch,
          updatedAt: serverTimestamp(),
          migratedAt: serverTimestamp()
        }, { merge: true });
        masterDocument = { ...masterDocument, ...patch };
      }
    } else {
      createPreV2LocalBackup(sharedDocument || { designs: state.designs });
      const v2 = buildV2SchemaFromLegacy(state.designs);
      await setDoc(masterRef, {
        ...v2,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        migratedAt: serverTimestamp(),
        sourceDocument: 'tshirtStock/shared'
      }, { merge: true });
      masterDocument = v2;
    }
    masterReady = true;
    renderSchemaStatus(masterDocument);
    return true;
  } catch(error){
    masterReady = false;
    masterError = error;
    console.error('master init failed', error);
    renderSchemaStatus();
    return false;
  }
}

function buildDefaultDesigns(){
  const designs = {};
  DEFAULT_DESIGNS.forEach(name => {
    designs[name] = { colors: [...DEFAULT_COLORS], stock: {}, planned: {}, starred: false };
  });
  return designs;
}

let state = {
  designs: buildDefaultDesigns(),
  activeDesign: DEFAULT_DESIGNS[0],
  sortMode: 'priority'
};

function ensureStock(design){
  const d = state.designs[design];
  if(!d.planned) d.planned = {};
  d.colors.forEach(c => {
    if(!d.stock[c]) d.stock[c] = {};
    if(!d.planned[c]) d.planned[c] = {};
    SIZES.forEach(s => {
      if(d.stock[c][s] == null) d.stock[c][s] = 0;
      if(d.planned[c][s] == null) d.planned[c][s] = 0;
    });
  });
}

function totalForColor(design, color){
  const d = state.designs[design];
  return SIZES.reduce((sum,s) => sum + (d.stock[color]?.[s] || 0), 0);
}
function totalForDesign(design){
  const d = state.designs[design];
  return d.colors.reduce((sum,c) => sum + totalForColor(design,c), 0);
}
function totalStockAll(){
  return Object.keys(state.designs).reduce((sum, design) => {
    ensureStock(design);
    return sum + totalForDesign(design);
  }, 0);
}
function renderStockSummary(){
  const box = document.getElementById('stock-summary');
  if(!box) return;
  box.innerHTML = `
    <div class="stock-summary">
      <span class="stock-summary-label">Tシャツ在庫 合計</span>
      <span class="stock-summary-value">${totalStockAll()}<span class="stock-summary-unit"> 枚</span></span>
    </div>`;
}
function totalPlannedForColor(design, color){
  const d = state.designs[design];
  return SIZES.reduce((sum,s) => sum + (d.planned?.[color]?.[s] || 0), 0);
}
function totalPlannedForDesign(design){
  const d = state.designs[design];
  return d.colors.reduce((sum,c) => sum + totalPlannedForColor(design,c), 0);
}

function plannedColorNames(){
  const names = [];
  const seen = new Set();
  const add = color => {
    if(!seen.has(color)){
      seen.add(color);
      names.push(color);
    }
  };
  DEFAULT_COLORS.forEach(add);
  Object.keys(state.designs).forEach(design => {
    state.designs[design].colors.forEach(add);
  });
  return names;
}

function totalPlannedForColorSize(color, size){
  return Object.keys(state.designs).reduce((sum, design) => {
    ensureStock(design);
    return sum + (state.designs[design].planned?.[color]?.[size] || 0);
  }, 0);
}

function totalPlannedAcrossDesignsForColor(color){
  return SIZES.reduce((sum, size) => sum + totalPlannedForColorSize(color, size), 0);
}

function plannedColorSummary(){
  return plannedColorNames()
    .map(color => ({
      color,
      sizes: Object.fromEntries(SIZES.map(size => [size, totalPlannedForColorSize(color, size)])),
      total: totalPlannedAcrossDesignsForColor(color)
    }))
    .filter(item => item.total > 0);
}

function totalPlannedAll(){
  return plannedColorSummary().reduce((sum, item) => sum + item.total, 0);
}

function plannedDesignCount(){
  return Object.keys(state.designs).filter(design => totalPlannedForDesign(design) > 0).length;
}

function plannedDesignSummary(){
  return Object.keys(state.designs)
    .map(design => ({ design, total: totalPlannedForDesign(design) }))
    .filter(item => item.total > 0)
    .sort((a,b) => b.total - a.total || a.design.localeCompare(b.design, 'ja'));
}

function renderProductionSummary(){
  const box = document.getElementById('production-summary');
  if(!box) return;
  const summary = plannedColorSummary();
  const designSummary = plannedDesignSummary();
  box.innerHTML = `
    <div class="production-summary">
      <div class="production-summary-title">制作予定に必要なTシャツ 色別集計</div>
      ${summary.length ? `
        <table class="production-color-table">
          <thead>
            <tr>
              <th>色</th>
              ${SIZES.map(size => `<th>${size}</th>`).join('')}
              <th>計</th>
            </tr>
          </thead>
          <tbody>
            ${summary.map(item => `
              <tr>
                <td>${item.color}</td>
                ${SIZES.map(size => `<td>${item.sizes[size]}</td>`).join('')}
                <td>${item.total}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : '<div class="production-empty">制作予定はまだありません。</div>'}

      ${designSummary.length ? `
        <div class="production-summary-title" style="margin-top:14px;">制作予定 デザイン別集計</div>
        <table class="production-color-table">
          <thead>
            <tr>
              <th>デザイン</th>
              <th>数量</th>
            </tr>
          </thead>
          <tbody>
            ${designSummary.map(item => `
              <tr>
                <td>${item.design}</td>
                <td>${item.total} 枚</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : ''}

      <div class="production-summary-footer">
        <span>合計 <strong>${totalPlannedAll()}</strong> 枚</span>
        <span>デザイン <strong>${plannedDesignCount()}</strong> 種</span>
      </div>
    </div>`;
}


function exportInventoryCsv(){
  const rows = [['デザイン','色','サイズ','在庫数','制作予定','優先']];
  Object.keys(state.designs).forEach(design => {
    ensureStock(design);
    const d = state.designs[design];
    d.colors.forEach(color => {
      SIZES.forEach(size => {
        const stock = Number(d.stock?.[color]?.[size] || 0);
        const planned = Number(d.planned?.[color]?.[size] || 0);
        if(stock > 0 || planned > 0){
          rows.push([design, color, size, stock, planned, d.starred ? '★' : '']);
        }
      });
    });
  });

  const csv = rows.map(row => row.map(value => {
    const text = String(value ?? '');
    return '"' + text.replace(/"/g, '""') + '"';
  }).join(',')).join('\r\n');

  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tshirt_inventory_${y}${m}${d}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function setSyncStatus(text, mode = ''){
  const el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (mode ? ' ' + mode : '');
}

function saveLocal(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    localStorage.setItem(UI_STORAGE_KEY, JSON.stringify({
      activeDesign: state.activeDesign,
      sortMode: state.sortMode
    }));
  } catch(e){
    console.error('local save failed', e);
  }
}

async function saveCloudNow(){
  if(!cloudReady) return;
  setSyncStatus('同期中…');
  try {
    await setDoc(sharedRef, {
      designs: state.designs,
      updatedAt: serverTimestamp()
    }, { merge: true });
    sharedDocument = { ...(sharedDocument || {}), designs: state.designs };
    setSyncStatus('共有済み', 'ok');
  } catch(e){
    console.error('shared save failed', e);
    setSyncStatus(`在庫同期エラー：${e.code || 'unknown'}`, 'error');
    return;
  }

  if(masterReady){
    try {
      const patch = buildMasterMirrorPatch();
      await setDoc(masterRef, {
        ...patch,
        updatedAt: serverTimestamp()
      }, { merge: true });
      masterDocument = { ...(masterDocument || {}), ...patch };
      masterError = null;
      renderSchemaStatus(masterDocument);
    } catch(e){
      console.error('master mirror save failed', e);
      masterReady = false;
      masterError = e;
      renderSchemaStatus();
    }
  }
}

function save(){
  saveLocal();
  if(!cloudReady) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(saveCloudNow, 250);
}

function sortedDesignNames(){
  const names = Object.keys(state.designs);
  const mode = state.sortMode || 'priority';
  return names.sort((a,b) => {
    if(mode === 'priority'){
      const sa = state.designs[a].starred ? 1 : 0;
      const sb = state.designs[b].starred ? 1 : 0;
      return sb - sa;
    }
    if(mode === 'stock-asc') return totalForDesign(a) - totalForDesign(b);
    if(mode === 'stock-desc') return totalForDesign(b) - totalForDesign(a);
    if(mode === 'name') return a.localeCompare(b, 'ja');
    return 0;
  });
}

function renderTabs(){
  const tabs = document.getElementById('design-tabs');
  let html = '';
  sortedDesignNames().forEach(name => {
    const active = name === state.activeDesign;
    const star = state.designs[name].starred ? '<span class="tab-star">★</span>' : '';
    html += `<button class="tab ${active ? 'active' : ''}" data-select-design="${name}">${star}${name}</button>`;
  });
  tabs.innerHTML = html;
  tabs.querySelectorAll('button[data-select-design]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeDesign = btn.getAttribute('data-select-design');
      renderTabs();
      render();
      saveLocal();
    });
  });
}

function render(){
  renderStockSummary();
  renderProductionSummary();
  const design = state.activeDesign;
  if(!state.designs[design]) return;
  ensureStock(design);
  const d = state.designs[design];
  const app = document.getElementById('app');
  let html = '';

  html += `<div class="total-row">
    <span class="total-label">${design} 合計在庫</span>
    <span class="total-value">${totalForDesign(design)}<span class="total-unit"> 枚</span></span>
  </div>`;
  html += `<div class="total-row">
    <span class="total-label">制作予定 合計</span>
    <span class="total-value">${totalPlannedForDesign(design)}<span class="total-unit"> 枚</span></span>
  </div>`;

  html += `<div class="design-settings">
    <div>
      <span class="priority-label">制作優先</span>
    </div>
    <button class="star-btn ${d.starred ? 'active' : ''}" id="star-priority-btn" type="button">${d.starred ? '★ 優先' : '☆ 優先'}</button>
  </div>`;

  if(d.colors.length > 0){
    html += '<div class="size-header">' + SIZES.map(s => `<div>${s}</div>`).join('') + '</div>';
  } else {
    html += '<p class="empty-note">まだ色が登録されていません。下から追加してください。</p>';
  }

  d.colors.forEach(color => {
    html += `<div class="color-card">
      <div class="color-row">
        <div class="color-name">${color}</div>
        ${SIZES.map(size => {
          const qty = d.stock[color][size];
          return `<div class="size-cell">
            <button class="qty-btn" data-color="${color}" data-size="${size}" data-delta="-1">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" data-color="${color}" data-size="${size}" data-delta="1">＋</button>
          </div>`;
        }).join('')}
      </div>
      <div class="planned-row">
        <div class="planned-label">制作予定</div>
        ${SIZES.map(size => {
          const plannedQty = d.planned[color][size];
          return `<div class="size-cell">
            <input class="planned-input" type="number" min="0" inputmode="numeric" data-planned-color="${color}" data-planned-size="${size}" value="${plannedQty}">
          </div>`;
        }).join('')}
      </div>
      <div class="card-footer">
        <span class="subtotal">在庫 ${totalForColor(design,color)} 枚　制作予定 ${totalPlannedForColor(design,color)} 枚</span>
        <button class="remove-btn" data-remove-color="${color}">削除</button>
      </div>
    </div>`;
  });

  if(Object.keys(state.designs).length > 1){
    html += `<button class="delete-design-btn" data-remove-design="${design}">「${design}」を削除</button>`;
  }

  app.innerHTML = html;

  const starPriorityBtn = document.getElementById('star-priority-btn');
  if(starPriorityBtn){
    starPriorityBtn.addEventListener('click', () => {
      d.starred = !d.starred;
      renderTabs();
      render();
      save();
    });
  }

  app.querySelectorAll('input[data-planned-color]').forEach(input => {
    const updatePlannedValue = () => {
      const color = input.getAttribute('data-planned-color');
      const size = input.getAttribute('data-planned-size');
      const value = Math.max(0, parseInt(input.value, 10) || 0);
      d.planned[color][size] = value;
      renderProductionSummary();
      saveLocal();
    };
    input.addEventListener('input', updatePlannedValue);
    input.addEventListener('change', () => {
      updatePlannedValue();
      save();
      render();
    });
  });

  app.querySelectorAll('button[data-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      const color = btn.getAttribute('data-color');
      const size = btn.getAttribute('data-size');
      const delta = parseInt(btn.getAttribute('data-delta'));
      const next = Math.max(0, (d.stock[color][size] || 0) + delta);
      d.stock[color][size] = next;
      renderTabs();
      render();
      save();
    });
  });

  app.querySelectorAll('button[data-remove-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      const color = btn.getAttribute('data-remove-color');
      d.colors = d.colors.filter(c => c !== color);
      delete d.stock[color];
      if(d.planned) delete d.planned[color];
      render();
      save();
    });
  });

  const removeDesignBtn = app.querySelector('button[data-remove-design]');
  if(removeDesignBtn){
    removeDesignBtn.addEventListener('click', () => {
      const name = removeDesignBtn.getAttribute('data-remove-design');
      delete state.designs[name];
      const remaining = Object.keys(state.designs);
      state.activeDesign = remaining[0];
      renderTabs();
      render();
      save();
    });
  }
}

document.getElementById('add-color-btn').addEventListener('click', () => {
  const input = document.getElementById('new-color');
  const val = input.value.trim();
  const d = state.designs[state.activeDesign];
  input.classList.remove('error');
  if(!val){
    input.classList.add('error');
    input.placeholder = '色の名前を入力してください';
    return;
  }
  if(d.colors.includes(val)){
    input.classList.add('error');
    return;
  }
  d.colors.push(val);
  input.value = '';
  render();
  save();
});
document.getElementById('new-color').addEventListener('input', (e) => { e.target.classList.remove('error'); });

document.getElementById('add-design-btn').addEventListener('click', () => {
  const input = document.getElementById('new-design');
  const val = input.value.trim();
  input.classList.remove('error');
  if(!val){
    input.classList.add('error');
    input.placeholder = 'デザイン名を入力してください';
    return;
  }
  if(state.designs[val]){
    input.classList.add('error');
    return;
  }
  state.designs[val] = { colors: [...DEFAULT_COLORS], stock: {}, planned: {}, starred: false };
  state.activeDesign = val;
  input.value = '';
  renderTabs();
  render();
  save();
});
document.getElementById('new-design').addEventListener('input', (e) => { e.target.classList.remove('error'); });

document.getElementById('sort-mode').addEventListener('change', (e) => {
  state.sortMode = e.target.value;
  renderTabs();
  saveLocal();
});

document.getElementById('export-inventory-btn').addEventListener('click', exportInventoryCsv);
document.getElementById('backup-json-btn').addEventListener('click', exportJsonBackup);

async function init(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.designs) state = parsed;
    }
    const uiRaw = localStorage.getItem(UI_STORAGE_KEY);
    if(uiRaw){
      const ui = JSON.parse(uiRaw);
      if(ui.activeDesign) state.activeDesign = ui.activeDesign;
      if(ui.sortMode) state.sortMode = ui.sortMode;
    }
  } catch(e) {
    console.log('no existing local data, using defaults');
  }

  if(!state.sortMode) state.sortMode = 'priority';
  Object.values(state.designs).forEach(d => {
    if(d.starred == null) d.starred = Number(d.priority) === 1;
    if(!d.planned) d.planned = {};
  });
  if(!state.designs[state.activeDesign]) state.activeDesign = Object.keys(state.designs)[0];
  document.getElementById('sort-mode').value = state.sortMode;

  renderTabs();
  render();
  renderSchemaStatus(null, 'loading');
  renderLastUpdated(null);

  try {
    setSyncStatus('在庫データに接続しています…');
    const snap = await getDoc(sharedRef);

    if(snap.exists()){
      sharedDocument = snap.data();
      if(sharedDocument?.designs){
        state.designs = sharedDocument.designs;
        Object.values(state.designs).forEach(d => {
          if(d.starred == null) d.starred = false;
          if(!d.planned) d.planned = {};
        });
        if(!state.designs[state.activeDesign]) state.activeDesign = Object.keys(state.designs)[0];
        saveLocal();
      }
    } else {
      createPreV2LocalBackup({ designs: state.designs });
      await setDoc(sharedRef, {
        designs: state.designs,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge: true });
      sharedDocument = { designs: state.designs };
    }

    cloudReady = true;
    setSyncStatus('共有済み', 'ok');
    renderLastUpdated(sharedDocument?.updatedAt);
    renderTabs();
    render();

    await ensureMasterDocument();

    onSnapshot(sharedRef, (snapshot) => {
      if(!snapshot.exists()) return;
      sharedDocument = snapshot.data();
      if(sharedDocument?.designs){
        state.designs = sharedDocument.designs;
        Object.values(state.designs).forEach(d => {
          if(d.starred == null) d.starred = false;
          if(!d.planned) d.planned = {};
        });
        if(!state.designs[state.activeDesign]) state.activeDesign = Object.keys(state.designs)[0];
        saveLocal();
        renderTabs();
        render();
      }
      renderLastUpdated(sharedDocument?.updatedAt);
      setSyncStatus(snapshot.metadata.hasPendingWrites ? '同期中…' : '共有済み', snapshot.metadata.hasPendingWrites ? '' : 'ok');
    }, (error) => {
      console.error('shared snapshot error', error);
      setSyncStatus(`在庫同期エラー：${error.code || 'unknown'}`, 'error');
    });

    if(masterReady){
      onSnapshot(masterRef, (snapshot) => {
        if(!snapshot.exists()) return;
        masterDocument = snapshot.data();
        masterError = null;
        masterReady = true;
        renderSchemaStatus(masterDocument);
      }, (error) => {
        console.error('master snapshot error', error);
        masterReady = false;
        masterError = error;
        renderSchemaStatus();
      });
    }
  } catch(e) {
    console.error('shared firebase init failed', e);
    cloudReady = false;
    setSyncStatus(`在庫同期エラー：${e.code || 'unknown'} ${e.message || ''}`, 'error');
    renderSchemaStatus();
  }
}

init();
</script>
