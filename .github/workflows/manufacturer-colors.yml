name: Shared manufacturer color checks
on:
  pull_request:
  push:
    branches:
      - feat/shared-manufacturer-colors
permissions:
  contents: read
jobs:
  colors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test tests/*.test.cjs
      - name: Inventory module syntax
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          source = Path('index.html').read_text()
          Path('stock-module.mjs').write_text(source.split('<script type="module">', 1)[1].split('</script>', 1)[0])
          PYTHON
          node --check stock-module.mjs

      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - run: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)" node tests/manufacturerColorEditor.browser.cjs
