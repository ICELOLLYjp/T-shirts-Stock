name: Apply inventory task overlay

on:
  push:
    branches:
      - feature/inventory-task-overlay-20260930
    paths:
      - scripts/patch_inventory_task_overlay.py
      - .github/workflows/apply-inventory-task-overlay.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-task-overlay-20260930
          fetch-depth: 0
      - name: Apply task overlay patch
        run: python scripts/patch_inventory_task_overlay.py
      - name: Verify module syntax and performance guardrails
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">([\s\S]*?)</script>', text)
          if not match:
              raise SystemExit('module script not found')
          module = match.group(1)
          Path('/tmp/tshirt-stock-module.mjs').write_text(module, encoding='utf-8')
          required = [
              'function buildInventoryTaskOverlay()',
              'review-task-stock',
              'review-task-order',
              'data-task-stock',
              'data-task-order'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing marker: {marker}')
          if 'getDocs(collection(db,\'tshirtStock\'' in module or 'getDoc(doc(db,\'tshirtStock\'' in module:
              raise SystemExit('unexpected new tshirtStock read pattern')
          PY
          node --check /tmp/tshirt-stock-module.mjs
          git diff --check
      - name: Commit only the app change
        run: |
          rm scripts/patch_inventory_task_overlay.py
          rm .github/workflows/apply-inventory-task-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Overlay production tasks on inventory list"
          git push origin HEAD:feature/inventory-task-overlay-20260930
