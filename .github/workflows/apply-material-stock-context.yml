name: Apply material stock context

on:
  push:
    branches:
      - feature/show-material-stock-in-inventory
    paths:
      - .github/workflows/apply-material-stock-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/show-material-stock-in-inventory
      - name: Patch inventory material context
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          css_old = """  .review-task-batch-save { width:100%; min-height:42px; margin-top:10px; border:1px solid var(--accent); border-radius:9px; background:var(--accent-solid); color:var(--accent-on-solid); font-weight:700; }\n  .review-table-wrap {"""
          css_new = """  .review-task-batch-save { width:100%; min-height:42px; margin-top:10px; border:1px solid var(--accent); border-radius:9px; background:var(--accent-solid); color:var(--accent-on-solid); font-weight:700; }\n  .review-sheet-meta { display:block; margin-top:3px; color:var(--text-secondary); font-size:10px; font-weight:600; line-height:1.3; }\n  .review-material-toggle { display:block; margin:4px 0 0 28px; padding:0; border:0; background:transparent; color:var(--accent); font:inherit; font-size:10px; font-weight:650; line-height:1.3; text-align:left; }\n  .review-material-toggle::after { content:' ›'; }\n  .review-material-toggle[aria-expanded=\"true\"]::after { content:' ⌄'; }\n  .review-material-detail { margin:3px 0 0 28px; color:var(--text-muted); font-size:9px; font-weight:500; line-height:1.35; white-space:normal; }\n  .review-material-detail[hidden] { display:none; }\n  .review-task-batch-note { margin:-2px 0 6px; color:var(--text-secondary); font-size:9px; line-height:1.35; }\n  .review-task-batch-resource { margin-top:3px; color:var(--accent); font-size:10px; font-weight:650; line-height:1.3; }\n  .review-task-batch-size small { white-space:normal; }\n  .review-table-wrap {"""
          assert css_old in text, 'CSS anchor not found'
          text = text.replace(css_old, css_new, 1)

          start = text.index('function renderInventoryOverview(){')
          end = text.index('function renderFinishedDisplayMode()', start)
          block = text[start:end]

          helper_old = """  const rows=allInventoryReviewRows(taskOverlay);\n  const sizes=masterSizes();\n  // The vertical axis is Design; each Design gets a size-by-size subtotal followed"""
          helper_new = """  const rows=allInventoryReviewRows(taskOverlay);\n  const sizes=masterSizes();\n  const materialIdsForPair=pair=>String(pair||'').split('|');\n  const blankQtyForPair=(pair,sizeId)=>{\n    const [bodyId,,colorId]=materialIdsForPair(pair);\n    return Math.max(0,Number(masterDocument?.blank_stock?.[bodyId]?.[colorId]?.[sizeId]?.qty||0));\n  };\n  const blankTotalForPair=pair=>sizes.reduce((sum,size)=>sum+blankQtyForPair(pair,size.id),0);\n  const sheetResourceText=designId=>{\n    const main=sheetStockQty(designId,'main');\n    return sheetSubEnabled(designId)\n      ? `シート 主${main} / 副${sheetStockQty(designId,'sub')}`\n      : `シート ${main}枚`;\n  };\n  const materialMetaHtml=row=>`<button type=\"button\" class=\"review-material-toggle\" data-review-material-toggle=\"${escapeHtml(row.pair)}\" aria-expanded=\"false\">未プリント ${blankTotalForPair(row.pair)}枚</button><div class=\"review-material-detail\" data-review-material-detail=\"${escapeHtml(row.pair)}\" hidden>${sizes.map(size=>`${escapeHtml(size.managementName||size.id)} ${blankQtyForPair(row.pair,size.id)}`).join(' / ')}</div>`;\n  // The vertical axis is Design; each Design gets a size-by-size subtotal followed"""
          assert helper_old in block, 'render helper anchor not found'
          block = block.replace(helper_old, helper_new, 1)

          design_old = """<span class=\"review-design-count\" data-review-design-count>${group.rows.length}組・確認済 ${count}組</span></th>"""
          design_new = """<span class=\"review-design-count\" data-review-design-count>${group.rows.length}組・確認済 ${count}組</span><span class=\"review-sheet-meta\">${escapeHtml(sheetResourceText(group.designId))}</span></th>"""
          assert design_old in block, 'design row anchor not found'
          block = block.replace(design_old, design_new, 1)

          variant_old = """</small></span></label></th>${sizes.map((size,index)=>editableCell(row,size,index)).join('')}"""
          variant_new = """</small></span></label>${materialMetaHtml(row)}</th>${sizes.map((size,index)=>editableCell(row,size,index)).join('')}"""
          assert variant_old in block, 'variant row anchor not found'
          block = block.replace(variant_old, variant_new, 1)

          batch_settings_old = """      <div class=\"review-task-batch-settings\"><label>制作方法<select id=\"review-task-batch-method\"><option value=\"inhouse\">自社制作</option><option value=\"outsourced\">外注</option></select></label><label>用途<select id=\"review-task-batch-purpose\"><option value=\"stock\">在庫用</option><option value=\"order\">オーダー品</option></select></label></div>\n      ${selectedRows.map(row=>"""
          batch_settings_new = """      <div class=\"review-task-batch-settings\"><label>制作方法<select id=\"review-task-batch-method\"><option value=\"inhouse\">自社制作</option><option value=\"outsourced\">外注</option></select></label><label>用途<select id=\"review-task-batch-purpose\"><option value=\"stock\">在庫用</option><option value=\"order\">オーダー品</option></select></label></div>\n      <div class=\"review-task-batch-note\">各サイズ　完＝完成品 / B＝未プリントBody / 制＝登録済制作</div>\n      ${selectedRows.map(row=>"""
          assert batch_settings_old in block, 'batch settings anchor not found'
          block = block.replace(batch_settings_old, batch_settings_new, 1)

          batch_title_old = """<div class=\"review-task-batch-row-title\">${escapeHtml(row.design)} / ${escapeHtml(row.body)} / ${escapeHtml(row.color)}</div><div class=\"review-task-batch-sizes\">"""
          batch_title_new = """<div class=\"review-task-batch-row-title\">${escapeHtml(row.design)} / ${escapeHtml(row.body)} / ${escapeHtml(row.color)}</div><div class=\"review-task-batch-resource\">${escapeHtml(sheetResourceText(materialIdsForPair(row.pair)[1]))} / 未プリント ${blankTotalForPair(row.pair)}枚</div><div class=\"review-task-batch-sizes\">"""
          assert batch_title_old in block, 'batch title anchor not found'
          block = block.replace(batch_title_old, batch_title_new, 1)

          batch_small_old = """<small>在${row.sizes[index]} / 制${row.taskStockSizes[index]+row.taskOrderSizes[index]}</small>"""
          batch_small_new = """<small>完${row.sizes[index]} B${blankQtyForPair(row.pair,size.id)} 制${row.taskStockSizes[index]+row.taskOrderSizes[index]}</small>"""
          assert batch_small_old in block, 'batch size anchor not found'
          block = block.replace(batch_small_old, batch_small_new, 1)

          check_anchor = """  box.querySelectorAll('[data-review-check]').forEach(input=>input.addEventListener('change',()=>{"""
          material_listener = """  box.querySelectorAll('[data-review-material-toggle]').forEach(button=>button.addEventListener('click',()=>{\n    const detail=button.nextElementSibling;\n    if(!detail?.matches('[data-review-material-detail]'))return;\n    const expanded=button.getAttribute('aria-expanded')==='true';\n    button.setAttribute('aria-expanded',String(!expanded));\n    detail.hidden=expanded;\n  }));\n"""
          assert check_anchor in block, 'checkbox listener anchor not found'
          block = block.replace(check_anchor, material_listener + check_anchor, 1)

          text = text[:start] + block + text[end:]
          path.write_text(text)

          handoff = Path('PROJECT_HANDOFF.md')
          htext = handoff.read_text()
          hanchor = """- successful registration clears the review checks and rerenders the existing in-memory task overlay.\n\nPerformance requirement:"""
          hnew = """- successful registration clears the review checks and rerenders the existing in-memory task overlay.\n\nMaterial context in the finished inventory list:\n\n- each Design subtotal shows current print-sheet stock;\n- each Body / Color row shows the total blank Body stock with an optional Size breakdown;\n- the batch production-task editor shows current print-sheet stock, blank Body total, and Size-level blank Body availability;\n- all values are calculated from the already-loaded `masterDocument.blank_stock`, `print_sheets`, and `sheet_settings`; no additional Firestore read or listener is used.\n\nPerformance requirement:"""
          assert hanchor in htext, 'handoff anchor not found'
          htext = htext.replace(hanchor, hnew, 1)
          handoff.write_text(htext)
          PY
      - name: Validate module syntax and diff
        run: |
          git diff --check
          python3 <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          marker='<script type="module">'
          start=text.index(marker)+len(marker)
          end=text.index('</script>',start)
          Path('/tmp/app.mjs').write_text(text[start:end])
          PY
          node --check /tmp/app.mjs
          grep -q 'review-material-toggle' index.html
          grep -q 'blankQtyForPair' index.html
          grep -q 'review-task-batch-resource' index.html
      - name: Commit implementation
        run: |
          rm .github/workflows/apply-material-stock-context.yml
          git config user.name "ICELOLLYjp"
          git config user.email "325915577+ICELOLLYjp@users.noreply.github.com"
          git add index.html PROJECT_HANDOFF.md .github/workflows/apply-material-stock-context.yml
          git commit -m "Show material stock in finished inventory"
          git push
