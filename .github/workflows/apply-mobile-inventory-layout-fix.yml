name: Apply mobile inventory layout fix

on:
  push:
    branches:
      - feature/mobile-inventory-layout-fix-20260930

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-inventory-layout-fix-20260930
          fetch-depth: 0
      - name: Patch mobile inventory layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">'
          new_viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
          if old_viewport not in s:
              raise SystemExit('viewport anchor missing')
          s = s.replace(old_viewport, new_viewport, 1)

          old_touch = '''  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n  html, body {\n    margin: 0; padding: 0;'''
          new_touch = '''  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n  html, body,\n  button, a, input, select, textarea, [role="button"] {\n    touch-action: manipulation;\n  }\n  html, body {\n    margin: 0; padding: 0;'''
          if old_touch not in s:
              raise SystemExit('touch anchor missing')
          s = s.replace(old_touch, new_touch, 1)

          old_fallback = "  return labels[String(source || '')] || '更新元未記録';"
          new_fallback = "  return labels[String(source || '')] || '未記録';"
          if old_fallback not in s:
              raise SystemExit('source fallback anchor missing')
          s = s.replace(old_fallback, new_fallback, 1)

          anchor = '''  .review-table td:has(.review-stock-input) { padding: 4px 3px; }\n  .review-stock-cell {'''
          replacement = '''  .review-table td:has(.review-stock-input) { padding: 4px 3px; }\n  /* iPhone: keep the matrix dimensions stable even when task badges are shown. */\n  .review-table-wrap {\n    overscroll-behavior-inline: contain;\n    touch-action: pan-x pan-y;\n  }\n  .review-table {\n    width: max-content;\n    min-width: 482px;\n    table-layout: fixed;\n  }\n  .review-table th:first-child {\n    width: 142px;\n    min-width: 142px;\n    max-width: 142px;\n  }\n  .review-table thead th:not(:first-child):not(:last-child),\n  .review-table td:not(:first-child):not(:last-child) {\n    width: 58px;\n    min-width: 58px;\n    max-width: 58px;\n  }\n  .review-table th:last-child,\n  .review-table td:last-child {\n    width: 50px;\n    min-width: 50px;\n    max-width: 50px;\n  }\n  .review-stock-input {\n    width: 46px;\n    min-width: 46px;\n  }\n  .review-stock-cell {'''
          if anchor not in s:
              raise SystemExit('review table anchor missing')
          s = s.replace(anchor, replacement, 1)

          old_cell = '''  .review-stock-cell {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    gap: 2px;\n    min-width: 48px;\n  }'''
          new_cell = '''  .review-stock-cell {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    gap: 2px;\n    width: 100%;\n    min-width: 0;\n  }'''
          if old_cell not in s:
              raise SystemExit('stock cell anchor missing')
          s = s.replace(old_cell, new_cell, 1)

          old_overlay = '''  .review-task-overlay {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-wrap: wrap;\n    gap: 2px;\n    min-height: 12px;\n    margin-top: 2px;\n  }'''
          new_overlay = '''  .review-task-overlay {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-wrap: wrap;\n    gap: 2px;\n    width: 100%;\n    min-width: 0;\n    min-height: 12px;\n    margin-top: 2px;\n  }'''
          if old_overlay not in s:
              raise SystemExit('task overlay anchor missing')
          s = s.replace(old_overlay, new_overlay, 1)

          media_anchor = '''  .card-footer { flex-wrap: wrap; gap: 4px 8px; }\n</style>'''
          media_replacement = '''  .card-footer { flex-wrap: wrap; gap: 4px 8px; }\n  @media (max-width: 430px) {\n    .inventory-review { padding: 10px 8px; }\n    .review-table th:first-child {\n      width: 132px;\n      min-width: 132px;\n      max-width: 132px;\n    }\n    .review-table thead th:not(:first-child):not(:last-child),\n    .review-table td:not(:first-child):not(:last-child) {\n      width: 56px;\n      min-width: 56px;\n      max-width: 56px;\n    }\n    .review-table th:last-child,\n    .review-table td:last-child {\n      width: 46px;\n      min-width: 46px;\n      max-width: 46px;\n    }\n    .review-table { min-width: 458px; }\n    .review-table th,.review-table td { padding-left: 3px; padding-right: 3px; }\n    .review-stock-input { width: 44px; min-width: 44px; }\n    .review-variant-label { align-items: flex-start; gap: 5px; }\n    .inventory-update-meta { font-size: 9px; line-height: 1.25; }\n  }\n</style>'''
          if media_anchor not in s:
              raise SystemExit('final style anchor missing')
          s = s.replace(media_anchor, media_replacement, 1)

          p.write_text(s)
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'touch-action: manipulation' index.html
          grep -Fq 'width: 132px' index.html
          grep -Fq "return labels[String(source || '')] || '未記録';" index.html
          grep -Fq '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' index.html
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('touch-action: manipulation') >= 1
          assert 'maximum-scale=1' not in s
          assert 'user-scalable=no' not in s
          assert '.review-table {\n    width: max-content;' in s
          assert 'overscroll-behavior-inline: contain;' in s
          print('mobile inventory layout checks passed')
          PY
      - name: Commit result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-mobile-inventory-layout-fix.yml
          git add index.html
          git commit -m 'Stabilize mobile inventory table and prevent double-tap zoom'
          git push origin HEAD:feature/mobile-inventory-layout-fix-20260930
