name: Apply verified blush theme
on:
  push:
    branches:
      - feature/blush-pink-theme-20260922
    paths:
      - .github/workflows/apply-blush-theme.yml
permissions:
  contents: write
jobs:
  apply-css-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify base, apply theme, and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "faa8b76e094423d9dc0ca9533294e7e4cfa6b570"
          base64 -d .github/ui-updates/blush-pink-theme-20260922.patch.gz.b64 | gzip -dc > /tmp/blush-theme.patch
          git apply --check /tmp/blush-theme.patch
          git apply /tmp/blush-theme.patch
          test "$(git hash-object index.html)" = "08293b76bd407d9e049a39e45eb92c4e1aba5b08"
          python3 -c 'import pathlib,re; s=pathlib.Path("index.html").read_text(); m=re.search(r"<script type=\"module\">(.*?)</script>",s,re.S); assert m; pathlib.Path("/tmp/stock-theme.mjs").write_text(m.group(1))'
          node --check /tmp/stock-theme.mjs
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit CSS-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine app colors with accessible blush-pink theme"
          git push origin HEAD:feature/blush-pink-theme-20260922