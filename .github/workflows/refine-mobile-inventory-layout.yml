name: Refine mobile inventory layout

on:
  push:
    branches:
      - feature/mobile-inventory-layout-fix-20260930

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-inventory-layout-fix-20260930
          fetch-depth: 0
      - name: Use stable full-width table layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''  .review-table {\n    width: max-content;\n    min-width: 482px;\n    table-layout: fixed;\n  }'''
          new='''  .review-table {\n    width: 100%;\n    min-width: 482px;\n    table-layout: fixed;\n  }'''
          if old not in s:
              raise SystemExit('table width anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'width: 100%;' index.html
          grep -Fq 'table-layout: fixed;' index.html
          grep -Fq 'touch-action: manipulation;' index.html
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refine-mobile-inventory-layout.yml
          git add index.html
          git commit -m 'Refine fixed inventory table sizing for iPhone'
          git push origin HEAD:feature/mobile-inventory-layout-fix-20260930
