name: Apply verified recipient-address UI
on:
  push:
    paths:
      - .github/workflows/apply-recipient-address.yml
permissions:
  contents: write
jobs:
  apply-verified-address-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check base, apply patch, validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "8fe5279d9b3566f1ba093e19add21f2bee4696f2"
          cat .github/ui-updates/ems-part-{1,2,3,4}.txt | tr -d '\n' | base64 --decode | gzip -d > /tmp/recipient.patch
          git apply --check /tmp/recipient.patch
          git apply /tmp/recipient.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*type="module"[^>]*>([\s\S]*?)</script>',html)
          assert len(scripts)==1
          Path('/tmp/check-recipient.mjs').write_text(scripts[0])
          assert 'function customerShippingNeedsAddress' in html
          assert 'shipRecipientName' in html and 'shipCountry' in html
          PY
          node --check /tmp/check-recipient.mjs
          test "$(git hash-object index.html)" = "faa8b76e094423d9dc0ca9533294e7e4cfa6b570"
      - name: Commit checked index.html to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Japan Post recipient-address fields to Orders"
          git push origin "HEAD:${GITHUB_REF_NAME}"
