name: Apply verified EMS recipient address UI
on:
  push:
    branches: [feature/ems-recipient-address-20260922]
    paths: ['.github/workflows/apply-ems-address.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline and apply EMS patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "8fe5279d9b3566f1ba093e19add21f2bee4696f2"
          cat .github/ui-updates/ems-part-{1,2,3,4,5}.txt > /tmp/ems.patch.gz.b64
          echo '0e03b6d043d010bd3f7f35bcabe292f76b26ce9b1e43ca51f524ceb0ef4a507a  /tmp/ems.patch.gz.b64' | sha256sum --check -
          base64 --decode /tmp/ems.patch.gz.b64 | gzip --decompress > /tmp/ems.patch
          patch -p1 < /tmp/ems.patch
          test "$(git hash-object index.html)" = "30d1f179804f2f1b6d307da226978c41079574d3"
          sed -n '/<script type="module">/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/ems-app.mjs
          node --check /tmp/ems-app.mjs
      - name: Commit verified index.html only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add EMS recipient address fields to customer Orders'
          git push
