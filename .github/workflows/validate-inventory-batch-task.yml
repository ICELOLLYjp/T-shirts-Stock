name: Validate inventory batch task registration

on:
  push:
    branches:
      - feature/inventory-batch-task-20261001

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-batch-task-20261001
          fetch-depth: 0
      - name: Check inline module syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>', start)
          Path('/tmp/tshirts-app.mjs').write_text(s[start:end], encoding='utf-8')
          assert 'async function addProductionTaskSelectionsBatch' in s
          assert 'id="review-task-batch-save"' in s
          PY
          node --check /tmp/tshirts-app.mjs
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/validate-inventory-batch-task.yml
          git commit -m 'Validate inventory batch task registration syntax'
          git push origin HEAD:feature/inventory-batch-task-20261001
