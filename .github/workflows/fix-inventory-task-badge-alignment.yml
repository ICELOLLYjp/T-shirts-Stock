name: Fix inventory task badge alignment

on:
  push:
    branches:
      - fix/align-inventory-task-badges-20260930

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/align-inventory-task-badges-20260930
          fetch-depth: 0

      - name: Align cells with and without task badges
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_badge = """  const taskBadgeHtml=(stockTask=0,orderTask=0)=>{\n    const stock=Math.max(0,Number(stockTask||0));\n    const order=Math.max(0,Number(orderTask||0));\n    if(!stock && !order)return '';\n    return `<span class=\"review-task-overlay\">${stock?`<span class=\"review-task-stock\" title=\"在庫用制作タスク\">＋${stock}</span>`:''}${order?`<span class=\"review-task-order\" title=\"オーダー制作タスク\">注${order}</span>`:''}</span>`;\n  };"""
          new_badge = """  const taskBadgeHtml=(stockTask=0,orderTask=0)=>{\n    const stock=Math.max(0,Number(stockTask||0));\n    const order=Math.max(0,Number(orderTask||0));\n    return `<span class=\"review-task-overlay\">${stock?`<span class=\"review-task-stock\" title=\"在庫用制作タスク\">＋${stock}</span>`:''}${order?`<span class=\"review-task-order\" title=\"オーダー制作タスク\">注${order}</span>`:''}</span>`;\n  };"""
          if old_badge not in text:
              raise SystemExit('taskBadgeHtml anchor missing')
          text = text.replace(old_badge, new_badge, 1)

          old_height = """    min-height: 12px;\n    margin-top: 2px;"""
          new_height = """    min-height: 14px;\n    margin-top: 2px;"""
          if old_height not in text:
              raise SystemExit('task overlay height anchor missing')
          text = text.replace(old_height, new_height, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'min-height: 14px;' index.html
          if grep -Fq "if(!stock && !order)return '';" index.html; then
            echo 'Empty task overlays are still being omitted'
            exit 1
          fi

      - name: Commit result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-inventory-task-badge-alignment.yml
          git add index.html
          git commit -m 'Align inventory cells without task badges'
          git push origin HEAD:fix/align-inventory-task-badges-20260930
