name: Apply home screen icon metadata

on:
  push:
    branches:
      - feat/home-screen-icons
    paths:
      - .github/workflows/apply-home-screen-icons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-screen-icons
          fetch-depth: 0
      - name: Patch icon metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          lines = (
              '<link rel="icon" type="image/svg+xml" href="./app-icon.svg">\n'
              '<link rel="apple-touch-icon" href="./app-icon.svg">\n'
          )
          if lines.strip() not in text:
              anchor = '<title>Tシャツ在庫管理</title>\n'
              if anchor not in text:
                  raise SystemExit('Title anchor not found')
              text = text.replace(anchor, anchor + lines, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-home-screen-icons.yml
          git add index.html
          git commit -m "Configure home screen icon"
          git push origin HEAD:feat/home-screen-icons
