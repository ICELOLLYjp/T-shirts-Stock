name: Fix iPhone inventory matrix layout

on:
  push:
    branches:
      - fix/mobile-inventory-layout-20260930

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-inventory-layout-20260930
          fetch-depth: 0

      - name: Patch inventory layout
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_meta = "  .inventory-update-meta {\n    display: block;\n    margin-top: 3px;\n    white-space: normal;\n  }"
          new_meta = "  .inventory-update-meta {\n    display: -webkit-box;\n    margin-top: 3px;\n    overflow: hidden;\n    white-space: normal;\n    overflow-wrap: anywhere;\n    -webkit-box-orient: vertical;\n    -webkit-line-clamp: 2;\n  }"
          if old_meta not in text:
              raise SystemExit('inventory metadata CSS anchor missing')
          text = text.replace(old_meta, new_meta, 1)
          pattern = r"  @media \(max-width: 430px\) \{\n    \.inventory-review \{ padding: 10px 8px; \}\n.*?\n  \}"
          new_mobile = "  @media (max-width: 430px) {\n    .inventory-review { padding: 10px 6px; }\n    .review-table {\n      width: 100%;\n      min-width: 0;\n      table-layout: fixed;\n    }\n    .review-table th:first-child {\n      width: 34%;\n      min-width: 0;\n      max-width: none;\n    }\n    .review-table thead th:not(:first-child):not(:last-child),\n    .review-table td:not(:first-child):not(:last-child) {\n      width: 11.2%;\n      min-width: 0;\n      max-width: none;\n    }\n    .review-table th:last-child,\n    .review-table td:last-child {\n      width: 10%;\n      min-width: 0;\n      max-width: none;\n    }\n    .review-table th,.review-table td {\n      padding-left: 2px;\n      padding-right: 2px;\n    }\n    .review-stock-input {\n      width: calc(100% - 4px);\n      min-width: 0;\n      max-width: 44px;\n    }\n    .review-variant-label { align-items: flex-start; gap: 4px; }\n    .review-variant-label > span { min-width: 0; }\n    .inventory-update-meta { font-size: 9px; line-height: 1.2; }\n  }"
          text, count = re.subn(pattern, lambda match: new_mobile, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'mobile inventory CSS block replacement count: {count}')
          path.write_text(text, encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'width: 34%;' index.html
          grep -Fq 'width: 11.2%;' index.html
          grep -Fq 'width: calc(100% - 4px);' index.html
          grep -Fq -- '-webkit-line-clamp: 2;' index.html
          if grep -Fq 'min-width: 458px;' index.html; then
            echo 'Old forced mobile width remains'
            exit 1
          fi

      - name: Commit result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-mobile-inventory-layout-fix-20260930.yml
          git add index.html
          git commit -m 'Fix iPhone inventory matrix layout'
          git push origin HEAD:fix/mobile-inventory-layout-20260930
