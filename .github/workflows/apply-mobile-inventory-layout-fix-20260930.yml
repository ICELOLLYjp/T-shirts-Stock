name: Fix iPhone inventory matrix layout

on:
  push:
    branches:
      - fix/mobile-inventory-layout-20260930

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-inventory-layout-20260930
          fetch-depth: 0

      - name: Patch inventory layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_meta = '''  .inventory-update-meta {
    display: block;
    margin-top: 3px;
    white-space: normal;
  }'''
          new_meta = '''  .inventory-update-meta {
    display: -webkit-box;
    margin-top: 3px;
    overflow: hidden;
    white-space: normal;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }'''
          if old_meta not in text:
              raise SystemExit('inventory metadata CSS anchor missing')
          text = text.replace(old_meta, new_meta, 1)

          old_mobile = '''  @media (max-width: 430px) {
    .inventory-review { padding: 10px 8px; }
    .review-table th:first-child {
      width: 132px;
      min-width: 132px;
      max-width: 132px;
    }
    .review-table thead th:not(:first-child):not(:last-child),
    .review-table td:not(:first-child):not(:last-child) {
      width: 56px;
      min-width: 56px;
      max-width: 56px;
    }
    .review-table th:last-child,
    .review-table td:last-child {
      width: 46px;
      min-width: 46px;
      max-width: 46px;
    }
    .review-table { min-width: 458px; }
    .review-table th,.review-table td { padding-left: 3px; padding-right: 3px; }
    .review-stock-input { width: 44px; min-width: 44px; }
    .review-variant-label { align-items: flex-start; gap: 5px; }
    .inventory-update-meta { font-size: 9px; line-height: 1.25; }
  }'''
          new_mobile = '''  @media (max-width: 430px) {
    .inventory-review { padding: 10px 6px; }
    .review-table {
      width: 100%;
      min-width: 0;
      table-layout: fixed;
    }
    .review-table th:first-child {
      width: 34%;
      min-width: 0;
      max-width: none;
    }
    .review-table thead th:not(:first-child):not(:last-child),
    .review-table td:not(:first-child):not(:last-child) {
      width: 11.2%;
      min-width: 0;
      max-width: none;
    }
    .review-table th:last-child,
    .review-table td:last-child {
      width: 10%;
      min-width: 0;
      max-width: none;
    }
    .review-table th,.review-table td {
      padding-left: 2px;
      padding-right: 2px;
    }
    .review-stock-input {
      width: calc(100% - 4px);
      min-width: 0;
      max-width: 44px;
    }
    .review-variant-label { align-items: flex-start; gap: 4px; }
    .review-variant-label > span { min-width: 0; }
    .inventory-update-meta { font-size: 9px; line-height: 1.2; }
  }'''
          if old_mobile not in text:
              raise SystemExit('mobile inventory CSS block missing')
          text = text.replace(old_mobile, new_mobile, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'width: 34%;' index.html
          grep -Fq 'width: 11.2%;' index.html
          grep -Fq 'width: calc(100% - 4px);' index.html
          grep -Fq -- '-webkit-line-clamp: 2;' index.html
          if grep -Fq 'min-width: 458px;' index.html; then
            echo 'Old forced mobile width remains'
            exit 1
          fi

      - name: Commit result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-mobile-inventory-layout-fix-20260930.yml
          git add index.html
          git commit -m 'Fix iPhone inventory matrix layout'
          git push origin HEAD:fix/mobile-inventory-layout-20260930
