name: Apply outsourced task list

on:
  push:
    branches:
      - feature/separate-outsourced-task-list

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/separate-outsourced-task-list
          fetch-depth: 0
      - name: Separate inhouse and outsourced task lists
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); m=re.search(r'<script type=\"module\">(.*?)</script>',s,re.S); assert m; Path('/tmp/tshirts-stock-app.mjs').write_text(m.group(1),encoding='utf-8')"
          node --check /tmp/tshirts-stock-app.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html PROJECT_HANDOFF.md
          git commit -m "Separate outsourced production task list"
          rm .github/workflows/apply-outsourced-task-list.yml
          git add -u .github/workflows/apply-outsourced-task-list.yml
          git commit -m "Remove temporary task list workflow"
          git push origin HEAD:feature/separate-outsourced-task-list
